<path d="M16 582 H684" fill="none" stroke="#cdd8e3" stroke-width="1.6"/>
<text x="350" y="614" font-size="19" fill="#157458" font-weight="700" text-anchor="middle">업무 코드 재사용 · 이름 차이는 설정으로 대응</text>
<text x="350" y="642" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">사이트별 설정을 각각 적용한 매핑 결과의 비교</text>
</svg>
