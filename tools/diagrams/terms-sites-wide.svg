<text x="350.0" y="529" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">기존 이름에 매핑</text>
</g>
<path d="M580 395 V426" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-sites-wide-blue)"/>
<g class="component"><rect class="node" x="484" y="431" width="192" height="121" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.4"/>
<text x="580.0" y="463" font-size="21" fill="#157458" font-weight="750" text-anchor="middle">ESMPLUS</text>
<text x="580.0" y="498" font-size="18" fill="#192e42" font-weight="500" text-anchor="middle">테이블·시퀀스</text>
<text x="580.0" y="529" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">기존 이름에 매핑</text>
