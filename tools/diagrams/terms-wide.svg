<svg xmlns="http://www.w3.org/2000/svg" width="700" height="514" viewBox="0 0 700 514" role="img" aria-labelledby="terms-wide-title terms-wide-desc"><title id="terms-wide-title">화면 구성과 약관 내용을 나누고, 시행일이 노출 버전을 바꿉니다</title><desc id="terms-wide-desc">약관 그룹은 화면 하나에 함께 노출되는 묶음이고, 그룹 매핑이 포함 약관과 노출 순서를 정하며, 약관은 코드·버전·시행일을 가집니다. 매핑을 바꿀 때마다 그룹 ID를 올려 이력을 남깁니다. 새 버전은 미래 시행일로 미리 등록하면 그날부터 노출되고, 이전보다 과거 시행일이나 더 작은 버전은 등록할 수 없습니다. 버전과 시점은 설명용 예시입니다.</desc><defs><marker id="terms-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="terms-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="terms-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="terms-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="terms-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="30" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">화면 구성</text><rect x="26" y="50" width="170" height="70" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="111" y="82" font-size="19" style="fill:#285fbc" font-weight="750" text-anchor="middle">약관 그룹</text><text x="111" y="103" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">화면 하나의 묶음</text><path d="M196 85L258 85" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-arrow-blue)"/><rect x="262" y="50" width="180" height="70" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="352" y="82" font-size="19" style="fill:#285fbc" font-weight="750" text-anchor="middle">그룹 매핑</text><text x="352" y="103" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">포함 약관 · 노출 순서</text><path d="M442 85L504 85" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-arrow-blue)"/><rect x="508" y="50" width="170" height="70" rx="6" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="593" y="82" font-size="19" style="fill:#157458" font-weight="750" text-anchor="middle">약관</text><text x="593" y="103" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">코드 · 버전 · 시행일</text><path d="M352 120L352 148" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#terms-wide-arrow-muted)"/><text x="352" y="172" font-size="17" style="fill:#192e42" font-weight="700" text-anchor="middle">매핑 변경 이력</text><text x="352" y="194" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">바꿀 때마다 그룹 ID를 올려 기록</text><path d="M16 222L684 222" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="254" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">시행일 기준 노출 · 설명용 예시</text><path d="M120 282L670 282" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-arrow-blue)"/><text x="670" y="272" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="end">시간</text><path d="M420 290L420 410" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="368" y="264" width="104" height="26" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><text x="420" y="282" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">새 시행일</text><text x="26" y="330" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">v3</text><text x="56" y="330" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">현재</text><path d="M120 325L420 325" fill="none" stroke="#157458" stroke-width="6"/><path d="M420 325L660 325" fill="none" stroke="#cdd8e3" stroke-width="6"/><text x="270" y="312" font-size="15" style="fill:#157458" font-weight="650" text-anchor="middle">노출 중</text><text x="545" y="312" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">노출 종료</text><text x="26" y="390" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">v4</text><text x="56" y="390" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">새 버전</text><circle cx="220" cy="385" r="6" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><path d="M220 385L420 385" fill="none" stroke="#285fbc" stroke-width="2" stroke-dasharray="5 5"/><path d="M420 385L660 385" fill="none" stroke="#157458" stroke-width="6"/><text x="220" y="368" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="middle">미리 등록</text><text x="545" y="372" font-size="15" style="fill:#157458" font-weight="650" text-anchor="middle">그날부터 자동 노출</text><circle cx="126" cy="438" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m122.5 434.5 7 7 m0 -7 -7 7" stroke="#b33c42" stroke-width="1.8"/><text x="146" y="444" font-size="15" style="fill:#b33c42" font-weight="650" text-anchor="start">과거 시행일 · 더 작은 버전은 등록 불가</text><path d="M16 468L684 468" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="496" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">내용 변경과 화면 배치 변경을 따로 관리합니다.</text></svg>