<svg xmlns="http://www.w3.org/2000/svg" width="700" height="730" viewBox="0 0 700 730" role="img" aria-labelledby="terms-wide-title terms-wide-desc">
<title id="terms-wide-title">여러 그룹이 약관을 공유하고, 조회 시 적용 버전을 선택합니다</title><desc id="terms-wide-desc">그룹 A와 그룹 B는 각자의 매핑으로 같은 약관을 참조합니다. 그룹의 다른 약관은 생략한 설명용 관계도입니다. 그룹 항목과 순서는 어드민에서 드래그 앤 드롭으로 편집하며 변경 전 목록과 순서를 이력으로 남깁니다. 운영자가 v2를 시행일과 함께 미리 등록한 예에서, 새 시행일 전의 조회는 v1을, 시행일부터의 조회는 v2를 선택합니다. 연결된 모든 그룹의 조회에 같은 시각 기준을 적용합니다. v1과 v2 및 그룹 이름은 설명용입니다.</desc>
<defs>
<marker id="terms-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="terms-wide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="terms-wide-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="26" y="29" font-size="18" fill="#192e42" font-weight="700" text-anchor="start">01  여러 그룹에서 같은 약관 공유</text>
<g class="component"><rect class="node" x="26" y="64" width="160" height="78" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="106.0" y="93" font-size="20" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 A</text>
<text x="106.0" y="122" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">화면의 약관 묶음</text>
</g>
<path d="M186 103 H228" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-blue)"/>
<g class="component"><rect class="node" x="234" y="64" width="164" height="78" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="316.0" y="93" font-size="19" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 A 매핑</text>
<text x="316.0" y="122" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">포함 약관·순서</text>
</g>
<g class="component"><rect class="node" x="26" y="175" width="160" height="78" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="106.0" y="204" font-size="20" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 B</text>
<text x="106.0" y="233" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">화면의 약관 묶음</text>
</g>
<path d="M186 214 H228" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-blue)"/>
<g class="component"><rect class="node" x="234" y="175" width="164" height="78" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="316.0" y="204" font-size="19" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 B 매핑</text>
<text x="316.0" y="233" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">포함 약관·순서</text>
</g>
<path d="M398 103 H458 V141 H498" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-blue)"/>
<path d="M398 214 H458 V185 H498" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-blue)"/>
<g class="component"><rect class="node" x="504" y="112" width="170" height="103" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.4"/>
<text x="589.0" y="143" font-size="20" fill="#157458" font-weight="750" text-anchor="middle">같은 약관</text>
<text x="589.0" y="173" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">코드 · 버전</text>
<text x="589.0" y="199" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">시행일</text>
</g>
<text x="26" y="292" font-size="17" fill="#192e42" font-weight="650" text-anchor="start">그룹 구성: 드래그 앤 드롭으로 항목·순서 편집</text>
<text x="26" y="320" font-size="17" fill="#52677c" font-weight="500" text-anchor="start">저장 시 변경 전 목록과 순서도 이력으로 보존</text>
<path d="M16 347 H684" fill="none" stroke="#cdd8e3" stroke-width="1.6"/>
<text x="26" y="381" font-size="18" fill="#192e42" font-weight="700" text-anchor="start">02  미리 등록하고, 조회 시각으로 선택</text>
<g class="component"><rect class="node" x="26" y="405" width="648" height="67" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="350.0" y="432" font-size="18" fill="#285fbc" font-weight="700" text-anchor="middle">어드민에서 새 버전 v2와 시행일을 미리 등록</text>
<text x="350.0" y="456" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">v1·v2 및 그룹 A·B는 설명용 예시</text>
</g>
<text x="26" y="510" font-size="17" fill="#52677c" font-weight="650" text-anchor="start">현재 조회 시각</text>
<path d="M172 505 H668" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#terms-wide-muted)"/>
<g class="component"><rect class="node" x="26" y="535" width="298" height="114" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="175.0" y="564" font-size="19" fill="#285fbc" font-weight="700" text-anchor="middle">새 시행일 전 조회</text>
<text x="175.0" y="623" font-size="19" fill="#192e42" font-weight="700" text-anchor="middle">기존 버전 v1 선택</text>
</g>
<path d="M175 574 V595" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-wide-blue)"/>
<g class="component"><rect class="node" x="376" y="535" width="298" height="114" rx="7" fill="#fff" stroke="#157458" stroke-width="1.4"/>
<text x="525.0" y="564" font-size="19" fill="#157458" font-weight="700" text-anchor="middle">새 시행일부터 조회</text>
<text x="525.0" y="623" font-size="19" fill="#192e42" font-weight="700" text-anchor="middle">새 버전 v2 선택</text>
</g>
<path d="M525 574 V595" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#terms-wide-green)"/>
<text x="350" y="689" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">이 약관을 사용하는 모든 그룹에 같은 선택 기준 적용</text>
<text x="350" y="717" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">그룹별로 새 버전을 다시 연결하지 않습니다</text>
</svg>
