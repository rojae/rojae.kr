<svg xmlns="http://www.w3.org/2000/svg" width="330" height="1576" viewBox="0 0 330 1576" role="img" aria-labelledby="affiliate-architecture-narrow-title affiliate-architecture-narrow-desc"><title id="affiliate-architecture-narrow-title">제휴 동의 수신과 월 데이터 적재를 분리한 구조</title><desc id="affiliate-architecture-narrow-desc">삼성카드에 실제 적용한 제휴 연동의 개념 구조입니다. 지마켓 로그인·삼성카드 결제 고객은 지마켓 화면의 넛지에서 삼성카드 인증 화면을 열고 실시간으로 인증·동의합니다. 삼성카드는 지마켓 결제 이력 고객에게 넛지를 제공하고 받은 동의를 매일 09:00 API로 전달합니다. 두 API 경로는 member-be의 공통 동의 서비스를 사용하며 CI 회원 매칭, 동의·철회와 이력을 처리합니다. 별도 member-batch는 삼성카드 보유 데이터를 월 SFTP 파일로 받아 Spring Batch로 적재하며, 적재 데이터는 마케팅에 활용됩니다. 관리자 설정은 제휴사, 제휴 코드, 완료 고객당 정산 단가이며 동의·배치·리워드를 관측합니다. 제휴 API에는 전용 Gateway 라우트와 Nginx Ingress가 있으나 이 도식은 물리 네트워크 배치가 아닙니다. SFTP 파일은 HTTP 진입 경로를 통과하지 않습니다. 동일 규격의 코드 재사용은 설계 방향이며 동적 전략 테이블을 구현했다는 의미가 아닙니다.</desc><defs><marker id="affiliate-architecture-narrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="30" y="28" font-size="20" fill="#192e42" font-weight="750" text-anchor="start">제휴 동의와 데이터 적재</text><text x="30" y="66" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">01 지마켓에서 실시간 동의</text><g class="component"><rect class="node" x="30" y="90" width="280" height="108" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="170.0" y="119" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">지마켓 화면</text><text x="170.0" y="148" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">로그인·삼성카드 결제 고객</text><text x="170.0" y="174" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">넛지에서 삼성카드 인증 열기</text></g><path class="route" d="M170 198 V240" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="244" width="280" height="82" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="170.0" y="273" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">member-be · 공통 동의</text><text x="170.0" y="302" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">실시간 인증·동의 결과 처리</text></g><path class="route" d="M170 326 V360" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="364" width="280" height="82" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="170.0" y="393" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">동의·이력 저장</text><text x="170.0" y="422" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">실시간 동의 결과</text></g><path class="route" d="M10 285.0 H26" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#affiliate-architecture-narrow-arrow)"/><text x="30" y="470" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">02 삼성카드에서 일 API 수신</text><g class="component"><rect class="node" x="30" y="494" width="280" height="108" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="170.0" y="523" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">삼성카드</text><text x="170.0" y="552" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">지마켓 결제 이력 고객</text><text x="170.0" y="578" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">넛지 제공·동의 수집</text></g><path class="route" d="M170 602 V644" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="648" width="280" height="108" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="170.0" y="677" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">member-be · 공통 동의</text><text x="170.0" y="706" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">매일 09:00 API · CI 회원 매칭</text><text x="170.0" y="732" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">동의·철회 · 묶음 수신 확인</text></g><path class="route" d="M170 756 V790" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="794" width="280" height="82" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="170.0" y="823" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">동의·이력 저장</text><text x="170.0" y="852" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">일별 수신 결과</text></g><path class="route" d="M10 702.0 H26" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#affiliate-architecture-narrow-arrow)"/><text x="30" y="900" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">03 월 파일로 데이터 적재</text><g class="component"><rect class="node" x="30" y="924" width="280" height="82" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="170.0" y="953" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">삼성카드</text><text x="170.0" y="982" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">보유 데이터 · 월 SFTP 파일</text></g><path class="route" d="M170 1006 V1048" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="1052" width="280" height="82" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="170.0" y="1081" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">member-batch · 별도 배치</text><text x="170.0" y="1110" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">SFTP 수신 · Spring Batch 적재</text></g><path class="route" d="M170 1134 V1168" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="1172" width="280" height="82" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="170.0" y="1201" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">마케팅 데이터 활용</text><text x="170.0" y="1230" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">적재 데이터의 후속 활용</text></g><path class="route" d="M10 1093.0 H26" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#affiliate-architecture-narrow-arrow)"/><g class="component"><rect class="node" x="30" y="1300" width="280" height="160" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="170.0" y="1329" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">관리자 · 설정과 관측</text><text x="170.0" y="1358" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">제휴사 → 제휴 코드</text><text x="170.0" y="1384" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">완료 고객당 정산 단가</text><text x="170.0" y="1410" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">동의·배치·리워드 관측</text></g><path class="admin-rail" d="M30 1380 H10 V285" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5"/><text x="170" y="1496" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">실시간·일 API는 같은 동의 서비스</text><text x="170" y="1524" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">월 파일은 별도 배치에서 처리</text><text x="170" y="1552" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">실제 적용: 삼성카드</text></svg>