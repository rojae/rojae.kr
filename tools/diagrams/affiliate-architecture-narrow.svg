<svg xmlns="http://www.w3.org/2000/svg" width="330" height="1304" viewBox="0 0 330 1304" role="img" aria-labelledby="affiliate-architecture-narrow-title affiliate-architecture-narrow-desc">
<title id="affiliate-architecture-narrow-title">고객 화면과 운영 화면이 제휴 백엔드와 저장소를 사용하는 구조</title>
<desc id="affiliate-architecture-narrow-desc">고객 브라우저는 member-web을 이용합니다. member-web은 Spring MVC와 Thymeleaf로 페이지와 브라우저 스크립트를 제공하고 OpenFeign으로 제휴 백엔드를 호출합니다. 별도의 운영자는 Next.js 운영 웹과 브라우저 프록시를 거쳐 Spring 관리자 API를 이용합니다. 관리자 API는 Feign으로 제휴 백엔드를 호출하며 MongoDB의 오류·호출 이력도 직접 조회합니다. 제휴 백엔드는 Oracle RDB에서 설정·인증·동의·이력을 저장·조회하고 Redis에서 임시 인증 상태를 관리하며, MongoDB에는 오류·호출 이력을 남깁니다. 화살표는 논리적 호출과 저장소 접근 관계이며 서버 수나 물리적 배치를 나타내지 않습니다.</desc>
