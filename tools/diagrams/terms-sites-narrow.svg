<svg xmlns="http://www.w3.org/2000/svg" width="330" height="858" viewBox="0 0 330 858" role="img" aria-labelledby="terms-sites-narrow-title terms-sites-narrow-desc">
<title id="terms-sites-narrow-title">공통 코드는 유지하고, 사이트별 이름은 설정으로 매핑</title><desc id="terms-sites-narrow-desc">공통 약관 서비스의 JPA 모델과 Querydsl 조회를 재사용합니다. 사이트별 profile과 config에 있는 접두사 규칙을 Hibernate Naming Strategy에서 적용해 각 사이트의 기존 테이블과 시퀀스 이름에 매핑합니다. 세 갈래는 지마켓, 옥션, ESMPLUS 설정을 각각 적용했을 때의 매핑 결과를 비교한 것입니다. 실제 테이블 이름, 데이터베이스 수, 서버 배치나 요청별 라우팅을 나타내는 그림은 아닙니다.</desc>
<defs>
<marker id="terms-sites-narrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="terms-sites-narrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="terms-sites-narrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="28" font-size="18" fill="#192e42" font-weight="700" text-anchor="start">같은 코드에 사이트별 설정 적용</text>
