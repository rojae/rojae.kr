<svg xmlns="http://www.w3.org/2000/svg" width="700" height="568" viewBox="0 0 700 568" role="img" aria-labelledby="platform-wide-title platform-wide-desc"><title id="platform-wide-title">같은 모듈을 조합해 사이트별 회원 서비스로 배포합니다</title><desc id="platform-wide-desc">호출자 요청은 Gravitee API 게이트웨이에서 호출자 인증과 라우팅을 거쳐 지마켓·옥션 회원 서비스로 갑니다. 두 서비스는 공통, 통합, 제휴·인증 모듈을 함께 쓰고 사이트 정책 모듈만 다릅니다. 두 서비스는 통합 Oracle을 공유합니다. 제휴·인증 모듈은 제가 주로 개발했고, 전체 구조는 팀 공동 설계입니다. 실제 인스턴스와 네트워크 구성은 생략했습니다.</desc><defs><marker id="platform-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="platform-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="platform-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="platform-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="platform-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="26" y="20" width="168" height="56" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="110" y="43" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="middle">지마켓·옥션 앱·웹</text><text x="110" y="64" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="middle">내부 서비스</text><path d="M194 48L236 48" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#platform-wide-arrow-blue)"/><rect x="240" y="20" width="220" height="56" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="350" y="44" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">API 게이트웨이</text><text x="350" y="65" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Gravitee · 호출자 인증 · 라우팅</text><path d="M350 76V96H200V118" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#platform-wide-arrow-blue)"/><path d="M350 96H500V118" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#platform-wide-arrow-blue)"/><rect x="100" y="122" width="200" height="276" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="200" y="150" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">지마켓 회원 서비스</text><rect x="114" y="166" width="172" height="46" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="200" y="185" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="middle">공통</text><text x="200" y="205" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">회원정보 · 로그인 · 캐싱</text><rect x="114" y="222" width="172" height="46" rx="6" fill="#f2f5f9" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="200" y="251" font-size="16" style="fill:#52677c" font-weight="650" text-anchor="middle">지마켓 정책</text><rect x="114" y="278" width="172" height="46" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="200" y="297" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="middle">통합</text><text x="200" y="317" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">두 사이트 함께</text><rect x="114" y="334" width="172" height="46" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="200" y="353" font-size="16" style="fill:#285fbc" font-weight="750" text-anchor="middle">제휴 · 인증</text><text x="200" y="373" font-size="13.5" style="fill:#285fbc" font-weight="500" text-anchor="middle">제가 주로 개발</text><rect x="400" y="122" width="200" height="276" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="500" y="150" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">옥션 회원 서비스</text><rect x="414" y="166" width="172" height="46" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="500" y="185" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="middle">공통</text><text x="500" y="205" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">회원정보 · 로그인 · 캐싱</text><rect x="414" y="222" width="172" height="46" rx="6" fill="#f2f5f9" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="500" y="251" font-size="16" style="fill:#52677c" font-weight="650" text-anchor="middle">옥션 정책</text><rect x="414" y="278" width="172" height="46" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="500" y="297" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="middle">통합</text><text x="500" y="317" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">두 사이트 함께</text><rect x="414" y="334" width="172" height="46" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="500" y="353" font-size="16" style="fill:#285fbc" font-weight="750" text-anchor="middle">제휴 · 인증</text><text x="500" y="373" font-size="13.5" style="fill:#285fbc" font-weight="500" text-anchor="middle">제가 주로 개발</text><path d="M286 189L414 189" fill="none" stroke="#285fbc" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M286 301L414 301" fill="none" stroke="#285fbc" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M286 357L414 357" fill="none" stroke="#285fbc" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="312" y="178" width="76" height="22" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><text x="350" y="195" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="middle">같은 모듈</text><rect x="312" y="234" width="76" height="22" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><text x="350" y="251" font-size="14" style="fill:#52677c" font-weight="650" text-anchor="middle">사이트별</text><path d="M200 398V420H350V438" fill="none" stroke="#157458" stroke-width="1.6"/><path d="M500 398V420H350V438" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#platform-wide-arrow-green)"/><path d="M270 451a80 9 0 0 1 160 0v40a80 9 0 0 1 -160 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M270 451a80 9 0 0 0 160 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="350" y="482" font-size="16" style="fill:#157458" font-weight="700" text-anchor="middle">통합 Oracle</text><text x="450" y="466" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">데이터는 이미 하나였고</text><text x="450" y="488" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">나뉜 것은 API 계층</text><path d="M16 522L684 522" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="550" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="start">게이트웨이는 호출자를 확인하고, 회원 데이터 접근 권한은 각 서비스가 판단합니다.</text></svg>