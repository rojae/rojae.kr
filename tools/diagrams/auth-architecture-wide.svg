<svg xmlns="http://www.w3.org/2000/svg" width="700" height="790" viewBox="0 0 700 790" role="img" aria-labelledby="auth-architecture-wide-title auth-architecture-wide-desc"><title id="auth-architecture-wide-title">다섯 인증 모듈과 공통 세션을 묶은 통합인증 서비스 전체 구조</title><desc id="auth-architecture-wide-desc">지마켓, 옥션, ESMPLUS가 하나의 통합인증 서비스에 진입합니다. 도메인 정책으로 인증 유형을 판단하고, 다섯 내부 모듈은 UUID 조회와 관리자 설정 유효기간에 따른 세션 활성 여부 확인을 공통으로 사용합니다. 소유인증, 본인인증, 계좌인증, 정보인증, 기업인증은 별도 마이크로서비스가 아닌 내부 모듈입니다. 외부 연동이 필요한 인증은 업체별 신규 요청 비율에 따라 외부 인증업체를 선택합니다. 인증 관리자는 도메인 연동, 인증업체 비율과 세션 유효기간을 관리합니다. 실선은 요청 처리, 점선은 관리 설정입니다.</desc><defs><marker id="auth-architecture-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="auth-architecture-wide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect class="service-boundary" x="20" y="105" width="660" height="430" rx="7" fill="#edf3fd" stroke="#cdd8e3" stroke-width="1.5"/><text x="36" y="131" font-size="17" fill="#285fbc" font-weight="700" text-anchor="start">통합인증 서비스</text><g class="component"><rect class="node" x="30" y="18" width="200" height="56" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="130" y="45" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">지마켓</text></g><path class="route" d="M130 74 V90" fill="none" stroke="#285fbc" stroke-width="1.6"/><g class="component"><rect class="node" x="250" y="18" width="200" height="56" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="350" y="45" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">옥션</text></g><path class="route" d="M350 74 V90" fill="none" stroke="#285fbc" stroke-width="1.6"/><g class="component"><rect class="node" x="470" y="18" width="200" height="56" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="570" y="45" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">ESMPLUS</text></g><path class="route" d="M570 74 V90" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M130 90 H570" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M280 90 V140" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="30" y="145" width="300" height="72" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="180" y="172" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">공통 API · 도메인 정책</text><text x="180" y="196" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">도메인 · 인증 유형 판단</text></g><g class="component"><rect class="node" x="370" y="145" width="300" height="72" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="520" y="172" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">공통 UUID 세션</text><text x="520" y="196" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">조회 · 유효기간 · 활성 여부</text></g><path class="route" d="M330 181 H365" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><path class="route" d="M520 217 V242" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M87 242 H607" fill="none" stroke="#285fbc" stroke-width="1.6"/><text x="36" y="235" font-size="16" fill="#285fbc" font-weight="650" text-anchor="start">인증 유형별 처리 · 공통 세션 사용</text><path class="route" d="M87 242 V275" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="30" y="280" width="114" height="102" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="87" y="307" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">소유인증</text><text x="87" y="331" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">휴대폰</text><text x="87" y="353" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">이메일</text></g><path class="route" d="M87 382 V410" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M217 242 V275" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="160" y="280" width="114" height="102" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="217" y="307" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">본인인증</text><text x="217" y="331" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">휴대폰</text><text x="217" y="353" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">본인확인</text></g><path class="route" d="M217 382 V410" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M347 242 V275" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="290" y="280" width="114" height="102" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="347" y="307" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">계좌인증</text><text x="347" y="331" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">1원인증</text><text x="347" y="353" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">계좌주명</text></g><path class="route" d="M347 382 V410" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M477 242 V275" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="420" y="280" width="114" height="102" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="477" y="307" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">정보인증</text><text x="477" y="331" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">ID·비밀번호</text><text x="477" y="353" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">소셜인증</text></g><path class="route" d="M477 382 V410" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M607 242 V275" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="550" y="280" width="114" height="102" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="607" y="307" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">기업인증</text><text x="607" y="331" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">사업자확인</text></g><path class="route" d="M607 382 V410" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M87 410 H607" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M350 410 V438" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="100" y="443" width="500" height="72" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="350" y="470" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">인증업체 선택 · 신규 요청 비율 적용</text><text x="350" y="494" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">외부 연동이 필요한 인증만 업체 선택</text></g><path class="route" d="M350 515 V548" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-wide-blue)"/><g class="component"><rect class="node" x="100" y="553" width="500" height="70" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="350" y="580" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">외부 인증업체</text><text x="350" y="604" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">본인확인 · 계좌확인 · 소셜인증 등</text></g><g class="component"><rect class="node" x="30" y="690" width="640" height="80" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="350" y="717" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">인증 관리자</text><text x="350" y="741" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">도메인 연동 · 업체별 비율 · 세션 유효기간 관리</text></g><path class="route" d="M670 730 H690 V138 H300 V140" fill="none" stroke="#157458" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#auth-architecture-wide-green)"/><text x="30" y="673" font-size="15" fill="#52677c" font-weight="500" text-anchor="start">실선은 요청 처리 · 점선은 관리 설정</text></svg>