<svg xmlns="http://www.w3.org/2000/svg" width="700" height="890" viewBox="0 0 700 890" role="img" aria-labelledby="auth-architecture-wide-title auth-architecture-wide-desc"><title id="auth-architecture-wide-title">호출 서비스의 업무 판단과 분리한 통합인증 구조</title><desc id="auth-architecture-wide-desc">호출 서비스가 개인과 사업자 등 회원 유형과 업무 조건을 판단하고 유입코드와 목적코드로 요청합니다. 통합인증은 회원 서비스나 개별 도메인 업무 로직에 의존하지 않고 코드에 연결된 어드민 설정으로 인증을 수행합니다. 사이트, 유입코드, 인증 목적은 설정 관리 체계입니다. 다섯 내부 인증 모듈은 UUID 세션을 공통으로 사용합니다. 외부 연동이 필요한 인증은 인증업체로 이어지며, 휴대폰 본인인증과 계좌인증은 업체별 신규 요청 비중을 조정합니다. 실선은 요청 처리, 점선은 관리 설정입니다.</desc><defs>
<marker id="auth-architecture-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="auth-architecture-wide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
