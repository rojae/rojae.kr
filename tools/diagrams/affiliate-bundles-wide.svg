<svg xmlns="http://www.w3.org/2000/svg" width="700" height="704" viewBox="0 0 700 704" role="img" aria-labelledby="affiliate-bundles-wide-title affiliate-bundles-wide-desc">
<title id="affiliate-bundles-wide-title">도착 순서와 중복을 고려한 묶음 집계</title>
<desc id="affiliate-bundles-wide-desc">카드사 동의를 여러 묶음으로 받을 때 도착 순서와 중복을 고려해 집계하는 일반 개념도입니다. 수신한 묶음이 중복인지 확인하고 처음 받은 묶음만 집계합니다. 이미 받은 묶음은 집계에서 제외합니다. 그 결과로 전체 수신 여부와 누락을 확인합니다. 이 그림은 묶음 수신 집계의 개념이며 전체 동의 반영의 단 한 번 처리를 보장한다는 의미가 아닙니다.</desc>
<defs>
<marker id="affiliate-bundles-wide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/>
</marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="350.0" y="30" font-size="22" fill="#192e42" font-weight="750" text-anchor="middle">도착 순서와 중복을 고려한 집계</text>
<g class="component">
<rect class="node" x="200" y="66" width="300" height="96" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/>
<text x="350.0" y="97" font-size="18" fill="#52677c" font-weight="700" text-anchor="middle">카드사 동의 수신</text>
<text x="350.0" y="126" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">여러 묶음으로 도착</text>
</g>
<path class="route" d="M350 162 V196" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-wide-arrow)"/>
<g class="component">
<rect class="node" x="200" y="200" width="300" height="76" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/>
<text x="350.0" y="244.0" font-size="18" fill="#285fbc" font-weight="700" text-anchor="middle">묶음 중복 여부 확인</text>
</g>
<path class="route" d="M350 276 V310 H178 V344" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-wide-arrow)"/>
<path class="route" d="M350 310 H522 V344" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-wide-arrow)"/>
<g class="component">
<rect class="node" x="32" y="348" width="292" height="106" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/>
<text x="178.0" y="379" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">새 묶음</text>
<text x="178.0" y="408" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">처음 받은 묶음만 집계</text>
</g>
<g class="component">
<rect class="node" x="376" y="348" width="292" height="106" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/>
<text x="522.0" y="379" font-size="18" fill="#52677c" font-weight="700" text-anchor="middle">중복 묶음</text>
<text x="522.0" y="408" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">이미 받은 묶음은 집계에서 제외</text>
</g>
<path class="route" d="M178 454 V496 H350 V530" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-wide-arrow)"/>
<path class="route" d="M522 454 V496 H350" fill="none" stroke="#52677c" stroke-width="1.6"/>
<g class="component">
<rect class="node" x="200" y="534" width="300" height="100" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/>
<text x="350.0" y="565" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">수신 현황 확인</text>
<text x="350.0" y="594" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">전체 수신 여부 · 누락 확인</text>
</g>
<text x="350" y="678" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">묶음 집계의 개념 · 전체 동의 반영 보장과는 구분</text>
</svg>