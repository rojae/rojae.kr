<svg xmlns="http://www.w3.org/2000/svg" width="330" height="1010" viewBox="0 0 330 1010" role="img" aria-labelledby="terms-narrow-title terms-narrow-desc">
<title id="terms-narrow-title">여러 그룹이 약관을 공유하고, 조회 시 적용 버전을 선택합니다</title><desc id="terms-narrow-desc">그룹 A와 그룹 B는 각자의 매핑으로 같은 약관을 참조합니다. 그룹의 다른 약관은 생략한 설명용 관계도입니다. 그룹 항목과 순서는 어드민에서 드래그 앤 드롭으로 편집하며 변경 전 목록과 순서를 이력으로 남깁니다. 운영자가 v2를 시행일과 함께 미리 등록한 예에서, 새 시행일 전의 조회는 v1을, 시행일부터의 조회는 v2를 선택합니다. 연결된 모든 그룹의 조회에 같은 시각 기준을 적용합니다. v1과 v2 및 그룹 이름은 설명용입니다.</desc>
<defs>
<marker id="terms-narrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="terms-narrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="terms-narrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="16" y="27" font-size="18" fill="#192e42" font-weight="700" text-anchor="start">01  여러 그룹이 같은 약관 공유</text>
<g class="component"><rect class="node" x="16" y="52" width="140" height="77" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="86.0" y="81" font-size="20" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 A</text>
<text x="86.0" y="109" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">화면의 묶음</text>
</g>
<path d="M86 129 V156" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-blue)"/>
<g class="component"><rect class="node" x="16" y="161" width="140" height="82" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="86.0" y="191" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 A 매핑</text>
<text x="86.0" y="221" font-size="18" fill="#52677c" font-weight="500" text-anchor="middle">약관·순서</text>
</g>
<g class="component"><rect class="node" x="174" y="52" width="140" height="77" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="244.0" y="81" font-size="20" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 B</text>
<text x="244.0" y="109" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">화면의 묶음</text>
</g>
<path d="M244 129 V156" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-blue)"/>
<g class="component"><rect class="node" x="174" y="161" width="140" height="82" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="244.0" y="191" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">그룹 B 매핑</text>
<text x="244.0" y="221" font-size="18" fill="#52677c" font-weight="500" text-anchor="middle">약관·순서</text>
</g>
<path d="M86 243 V273 H120 V302" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-blue)"/>
<path d="M244 243 V273 H210 V302" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-blue)"/>
<g class="component"><rect class="node" x="42" y="307" width="246" height="88" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.4"/>
<text x="165.0" y="338" font-size="21" fill="#157458" font-weight="750" text-anchor="middle">같은 약관</text>
<text x="165.0" y="371" font-size="18" fill="#192e42" font-weight="500" text-anchor="middle">코드 · 버전 · 시행일</text>
</g>
<text x="16" y="429" font-size="17" fill="#192e42" font-weight="650" text-anchor="start">드래그 앤 드롭으로 항목·순서 편집</text>
<text x="16" y="458" font-size="17" fill="#52677c" font-weight="500" text-anchor="start">변경 전 목록과 순서도 이력으로 보존</text>
<path d="M16 486 H314" fill="none" stroke="#cdd8e3" stroke-width="1.6"/>
<text x="16" y="522" font-size="18" fill="#192e42" font-weight="700" text-anchor="start">02  조회 시각으로 버전 선택</text>
<g class="component"><rect class="node" x="16" y="545" width="298" height="91" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.4"/>
<text x="165.0" y="574" font-size="18" fill="#285fbc" font-weight="700" text-anchor="middle">새 버전 v2와 시행일 미리 등록</text>
<text x="165.0" y="603" font-size="18" fill="#192e42" font-weight="500" text-anchor="middle">어드민에서 사전 작업</text>
<text x="165.0" y="625" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">그룹 A·B와 v1·v2는 설명용</text>
</g>
<path d="M27 669 V914" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#terms-narrow-muted)"/>
<text x="46" y="683" font-size="17" fill="#52677c" font-weight="650" text-anchor="start">조회 시각이 흐르면</text>
<g class="component"><rect class="node" x="52" y="703" width="262" height="84" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.4"/>
<text x="183.0" y="733" font-size="19" fill="#285fbc" font-weight="700" text-anchor="middle">새 시행일 전 조회</text>
<text x="183.0" y="765" font-size="19" fill="#192e42" font-weight="700" text-anchor="middle">기존 버전 v1 선택</text>
</g>
<g class="component"><rect class="node" x="52" y="823" width="262" height="84" rx="7" fill="#fff" stroke="#157458" stroke-width="1.4"/>
<text x="183.0" y="853" font-size="19" fill="#157458" font-weight="700" text-anchor="middle">새 시행일부터 조회</text>
<text x="183.0" y="885" font-size="19" fill="#192e42" font-weight="700" text-anchor="middle">새 버전 v2 선택</text>
</g>
<text x="165" y="950" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">이 약관을 쓰는 모든 그룹에</text>
<text x="165" y="977" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">같은 조회 시각 기준 적용</text>
</svg>
