<svg xmlns="http://www.w3.org/2000/svg" width="330" height="564" viewBox="0 0 330 564" role="img" aria-labelledby="terms-narrow-title terms-narrow-desc"><title id="terms-narrow-title">화면 구성과 약관 내용을 나누고, 시행일이 노출 버전을 바꿉니다</title><desc id="terms-narrow-desc">약관 그룹은 화면 하나에 함께 노출되는 묶음이고, 그룹 매핑이 포함 약관과 노출 순서를 정하며, 약관은 코드·버전·시행일을 가집니다. 매핑을 바꿀 때마다 그룹 ID를 올려 이력을 남깁니다. 새 버전은 미래 시행일로 미리 등록하면 그날부터 노출되고, 이전보다 과거 시행일이나 더 작은 버전은 등록할 수 없습니다. 버전과 시점은 설명용 예시입니다.</desc><defs><marker id="terms-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="terms-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="terms-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="terms-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="terms-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="14" y="24" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">화면 구성</text><rect x="14" y="38" width="302" height="58" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="165" y="64" font-size="18" style="fill:#285fbc" font-weight="750" text-anchor="middle">약관 그룹</text><text x="165" y="84" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">화면 하나의 묶음</text><path d="M110 96L110 118" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-arrow-blue)"/><rect x="14" y="122" width="192" height="58" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="110" y="148" font-size="18" style="fill:#285fbc" font-weight="750" text-anchor="middle">그룹 매핑</text><text x="110" y="168" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">포함 약관 · 순서</text><path d="M206 151L226 151" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#terms-narrow-arrow-muted)"/><text x="232" y="146" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="start">변경 이력</text><text x="232" y="166" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">그룹 ID 증가</text><path d="M110 180L110 202" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-arrow-blue)"/><rect x="14" y="206" width="302" height="58" rx="6" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="165" y="232" font-size="18" style="fill:#157458" font-weight="750" text-anchor="middle">약관</text><text x="165" y="252" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">코드 · 버전 · 시행일</text><path d="M14 286L316 286" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="314" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">시행일 기준 노출 · 예시</text><path d="M60 340L316 340" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#terms-narrow-arrow-blue)"/><path d="M190 346L190 446" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="146" y="324" width="88" height="24" rx="6" fill="#fff" stroke="none" stroke-width="1.5"/><text x="190" y="341" font-size="14" style="fill:#192e42" font-weight="700" text-anchor="middle">새 시행일</text><text x="14" y="384" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">v3</text><path d="M60 379L190 379" fill="none" stroke="#157458" stroke-width="6"/><path d="M190 379L308 379" fill="none" stroke="#cdd8e3" stroke-width="6"/><text x="125" y="368" font-size="14" style="fill:#157458" font-weight="650" text-anchor="middle">노출 중</text><text x="14" y="434" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">v4</text><circle cx="96" cy="429" r="6" fill="#285fbc" stroke="#285fbc" stroke-width="2"/><path d="M96 429L190 429" fill="none" stroke="#285fbc" stroke-width="2" stroke-dasharray="5 5"/><path d="M190 429L308 429" fill="none" stroke="#157458" stroke-width="6"/><text x="96" y="416" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="middle">미리 등록</text><text x="253" y="416" font-size="14" style="fill:#157458" font-weight="650" text-anchor="middle">자동 노출</text><circle cx="24" cy="474" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m20.5 470.5 7 7 m0 -7 -7 7" stroke="#b33c42" stroke-width="1.8"/><text x="42" y="479" font-size="14" style="fill:#b33c42" font-weight="650" text-anchor="start">과거 시행일 · 작은 버전 등록 불가</text><path d="M14 500L316 500" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="526" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">내용 변경과 화면 배치 변경을</text><text x="14" y="549" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">따로 관리합니다.</text></svg>