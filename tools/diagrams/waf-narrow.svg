<svg xmlns="http://www.w3.org/2000/svg" width="330" height="922" viewBox="0 0 330 922" role="img" aria-labelledby="waf-narrow-title waf-narrow-desc"><title id="waf-narrow-title">지금 볼 이벤트와 나중에 볼 이벤트를 다른 경로로 보냅니다</title><desc id="waf-narrow-desc">Nginx와 ModSecurity가 공격 요청을 차단하고 감사 로그를 JSON으로 남깁니다. Fluent Bit Lua 분류기가 SQL 인젝션·XSS·RCE 룰 또는 이상 점수 20 이상은 실시간 트랙으로, 스캐너 탐지(913xxx)는 분석 트랙으로 보냅니다. 실시간 트랙은 Kafka를 읽는 Go 처리기가 심각도와 GeoIP를 붙여 InfluxDB에 쓰고 Grafana와 대시보드가 봅니다. 분석 트랙은 Logstash가 Elasticsearch에 색인하고 Kibana로 조사하며, ksqlDB가 1분·5분 윈도우 집계를 만듭니다. ClickHouse는 미연결입니다. 커스텀 룰은 룰 파일과 reload 신호를 남기고 nginx -t 검증을 통과하면 무중단 reload합니다.</desc><defs><marker id="waf-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="waf-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="waf-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="waf-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="waf-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="14" y="14" width="302" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="37" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">Nginx + ModSecurity</text><text x="165" y="57" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">공격 요청 403 · 감사 로그 JSON</text><path d="M165 68L165 86" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><rect x="14" y="88" width="302" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="111" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">Fluent Bit · Lua 분류</text><text x="165" y="131" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">룰 ID · 이상 점수로 나눔</text><path d="M165 142L165 160" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><rect x="14" y="162" width="302" height="42" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="165" y="189" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">Kafka</text><path d="M165 190V204H84V222" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><path d="M165 204H246V222" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><rect x="14" y="226" width="140" height="324" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="84" y="252" font-size="17" style="fill:#285fbc" font-weight="750" text-anchor="middle">실시간</text><text x="84" y="274" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">SQLi·XSS·RCE</text><text x="84" y="292" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">이상 점수 ≥ 20</text><rect x="24" y="306" width="120" height="54" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="84" y="329" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">Go 처리기</text><text x="84" y="349" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">심각도·GeoIP</text><path d="M84 360L84 384" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-blue)"/><rect x="24" y="388" width="120" height="54" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="84" y="411" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">InfluxDB</text><text x="84" y="431" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">시계열</text><path d="M84 442L84 466" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-blue)"/><rect x="24" y="470" width="120" height="54" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="84" y="493" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">Grafana</text><text x="84" y="513" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">대시보드</text><rect x="176" y="226" width="140" height="324" rx="6" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="246" y="252" font-size="17" style="fill:#157458" font-weight="750" text-anchor="middle">분석</text><text x="246" y="274" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">스캐너 탐지</text><text x="246" y="292" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">913xxx</text><rect x="186" y="306" width="120" height="54" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="246" y="329" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">Logstash</text><text x="246" y="349" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">GeoIP</text><path d="M246 360L246 384" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-green)"/><rect x="186" y="388" width="120" height="54" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="246" y="411" font-size="14" style="fill:#157458" font-weight="700" text-anchor="middle">Elasticsearch</text><text x="246" y="430" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">일 단위</text><path d="M246 442L246 466" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-green)"/><rect x="186" y="470" width="120" height="54" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="246" y="493" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">Kibana</text><text x="246" y="513" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">사후 조사</text><text x="14" y="578" font-size="14" style="fill:#157458" font-weight="650" text-anchor="start">ksqlDB 1·5분 윈도우 집계</text><text x="14" y="600" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">ClickHouse는 스키마만 있고 미연결</text><path d="M14 622L316 622" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="650" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">룰 반영</text><rect x="14" y="664" width="302" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="686" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">대시보드 API</text><text x="165" y="706" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">커스텀 룰 저장</text><path d="M165 716L165 734" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><rect x="14" y="738" width="302" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="760" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">룰 파일 · 신호</text><text x="165" y="780" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">reload 신호 파일</text><path d="M165 790L165 808" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-narrow-arrow-ink)"/><rect x="14" y="812" width="302" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="834" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">nginx -t 검증</text><text x="165" y="854" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">통과 시 무중단 reload</text><text x="14" y="906" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="start">검증 실패 시 기존 설정 유지</text></svg>