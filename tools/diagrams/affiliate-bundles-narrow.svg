<text x="165.0" y="579" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">수신 현황 확인</text>
<text x="165.0" y="608" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">전체 수신 여부 · 누락 확인</text>
</g>
<text x="165" y="696" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">묶음 집계에 대한 개념도</text>
