<text x="85.0" y="375" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">새 묶음</text>
<text x="85.0" y="404" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">처음 받은</text>
<text x="85.0" y="431" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">묶음만 집계</text>
</g>
<g class="component">
<rect class="node" x="176" y="344" width="138" height="120" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/>
<text x="245.0" y="375" font-size="18" fill="#52677c" font-weight="700" text-anchor="middle">중복 묶음</text>
<text x="245.0" y="404" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">이미 받은 묶음</text>
<text x="245.0" y="431" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">집계에서 제외</text>
</g>
