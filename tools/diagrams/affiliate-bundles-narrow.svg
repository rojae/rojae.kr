<svg xmlns="http://www.w3.org/2000/svg" width="330" height="748" viewBox="0 0 330 748" role="img" aria-labelledby="affiliate-bundles-narrow-title affiliate-bundles-narrow-desc">
<title id="affiliate-bundles-narrow-title">도착 순서와 중복을 고려한 묶음 집계</title>
<desc id="affiliate-bundles-narrow-desc">카드사 동의를 여러 묶음으로 받을 때 도착 순서와 중복을 고려해 집계하는 일반 개념도입니다. 수신한 묶음이 중복인지 확인하고 처음 받은 묶음만 집계합니다. 이미 받은 묶음은 집계에서 제외합니다. 그 결과로 전체 수신 여부와 누락을 확인합니다. 이 그림은 묶음 수신 집계의 개념이며 전체 동의 반영의 단 한 번 처리를 보장한다는 의미가 아닙니다.</desc>
<defs>
<marker id="affiliate-bundles-narrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/>
</marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="165.0" y="30" font-size="20" fill="#192e42" font-weight="750" text-anchor="middle">도착 순서와 중복을 고려한 집계</text>
