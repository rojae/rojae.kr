<rect class="node" x="30" y="64" width="270" height="96" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/>
<text x="165.0" y="95" font-size="18" fill="#52677c" font-weight="700" text-anchor="middle">카드사 동의 수신</text>
<text x="165.0" y="124" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">여러 묶음으로 도착</text>
</g>
<path class="route" d="M165 160 V194" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-narrow-arrow)"/>
<g class="component">
<rect class="node" x="30" y="198" width="270" height="76" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/>
<text x="165.0" y="242.0" font-size="18" fill="#285fbc" font-weight="700" text-anchor="middle">묶음 중복 여부 확인</text>
</g>
<path class="route" d="M165 274 V308 H85 V340" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-narrow-arrow)"/>
<path class="route" d="M165 308 H245 V340" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-bundles-narrow-arrow)"/>
<g class="component">
