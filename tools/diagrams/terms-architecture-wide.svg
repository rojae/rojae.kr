<text x="178.0" y="125" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">약관·시행일 미리 등록</text>
<text x="178.0" y="153" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">그룹 항목·순서 편집</text>
