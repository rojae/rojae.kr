<svg xmlns="http://www.w3.org/2000/svg" width="700" height="450" viewBox="0 0 700 450" role="img" aria-labelledby="login-wide-title login-wide-desc"><title id="login-wide-title">재기동으로 증상은 사라졌고, 남은 런타임 제약을 전환으로 풀었습니다</title><desc id="login-wide-desc">DB 연결 단계 문제로 전체 로그인이 불가능한 장애가 났고 재기동으로 복구했습니다. 이후 원인과 제약을 분석하고 Java/Spring 전환을 설계했으며 저는 이 두 단계에 참여했습니다. 기존 .NET은 사내 보안 라이브러리 때문에 런타임 버전이 고정되어 Redis Cluster·MongoDB 연동이 어려웠습니다. 이 제약이 장애의 직접 원인은 아니지만 대응 폭을 좁혔습니다. 전환과 운영, Caffeine 캐시 적용은 팀 작업입니다.</desc><defs><marker id="login-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="login-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="login-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="login-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="login-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="30" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">진행 흐름</text><path d="M82 72L616 72" fill="none" stroke="#285fbc" stroke-width="1.6"/><path d="M82 72L197 72" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-wide-arrow-blue)"/><path d="M222 72L337 72" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-wide-arrow-blue)"/><path d="M362 72L477 72" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-wide-arrow-blue)"/><path d="M502 72L617 72" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-wide-arrow-blue)"/><circle cx="70" cy="72" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m66.5 68.5 7 7 m0 -7 -7 7" stroke="#b33c42" stroke-width="1.8"/><text x="70" y="112" font-size="17" style="fill:#b33c42" font-weight="750" text-anchor="middle">장애</text><text x="70" y="136" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">전체 로그인 불가</text><circle cx="210" cy="72" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="210" y="112" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">재기동</text><text x="210" y="136" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">증상만 복구</text><circle cx="350" cy="72" r="9" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="350" y="112" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">원인 · 제약 분석</text><text x="350" y="136" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">DB 연결 단계</text><circle cx="490" cy="72" r="9" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="490" y="112" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">전환 설계</text><text x="490" y="136" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">Java/Spring</text><circle cx="630" cy="72" r="9" fill="#fff" stroke="#157458" stroke-width="2"/><text x="630" y="112" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">전환 · 운영</text><text x="630" y="136" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">팀 작업</text><path d="M286 154V164H554V154" fill="none" stroke="#285fbc" stroke-width="1.8"/><text x="420" y="188" font-size="16" style="fill:#285fbc" font-weight="700" text-anchor="middle">제가 참여한 범위</text><path d="M16 212L684 212" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="244" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">바꾼 것은 언어보다 제약</text><rect x="26" y="262" width="300" height="118" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="44" y="292" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">기존 .NET 서비스</text><text x="44" y="322" font-size="15" style="fill:#b33c42" font-weight="650" text-anchor="start">× 런타임 버전 고정</text><text x="44" y="344" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">   사내 보안 라이브러리 지원 문제</text><text x="44" y="368" font-size="15" style="fill:#b33c42" font-weight="650" text-anchor="start">× Redis Cluster · MongoDB 연동 어려움</text><path d="M326 321L370 321" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-wide-arrow-blue)"/><rect x="374" y="262" width="300" height="118" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="392" y="292" font-size="17" style="fill:#285fbc" font-weight="750" text-anchor="start">Java / Spring 서비스</text><text x="392" y="322" font-size="15" style="fill:#157458" font-weight="650" text-anchor="start">✓ 조직이 지원하는 런타임</text><text x="392" y="346" font-size="15" style="fill:#157458" font-weight="650" text-anchor="start">✓ 연동 기술 적용 가능</text><text x="392" y="368" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">   Caffeine 캐시는 팀 작업</text><path d="M16 404L684 404" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="432" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">런타임 제약은 장애의 직접 원인이 아니라, 대응 폭을 좁히는 조건이었습니다.</text></svg>