<svg xmlns="http://www.w3.org/2000/svg" width="330" height="630" viewBox="0 0 330 630" role="img" aria-labelledby="platform-narrow-title platform-narrow-desc"><title id="platform-narrow-title">같은 모듈을 조합해 사이트별 회원 서비스로 배포합니다</title><desc id="platform-narrow-desc">호출자 요청은 Gravitee API 게이트웨이에서 호출자 인증과 라우팅을 거쳐 지마켓·옥션 회원 서비스로 갑니다. 두 서비스는 공통, 통합, 제휴·인증 모듈을 함께 쓰고 사이트 정책 모듈만 다릅니다. 두 서비스는 통합 Oracle을 공유합니다. 제휴·인증 모듈은 제가 주로 개발했고, 전체 구조는 팀 공동 설계입니다. 실제 인스턴스와 네트워크 구성은 생략했습니다.</desc><defs><marker id="platform-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="platform-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="platform-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="platform-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="platform-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><rect x="14" y="14" width="302" height="40" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="165" y="39" font-size="14" style="fill:#192e42" font-weight="650" text-anchor="middle">지마켓·옥션 앱·웹 · 내부 서비스</text><path d="M165 54L165 72" 