<svg xmlns="http://www.w3.org/2000/svg" width="330" height="710" viewBox="0 0 330 710" role="img" aria-labelledby="login-narrow-title login-narrow-desc"><title id="login-narrow-title">재기동으로 증상은 사라졌고, 남은 런타임 제약을 전환으로 풀었습니다</title><desc id="login-narrow-desc">DB 연결 단계 문제로 전체 로그인이 불가능한 장애가 났고 재기동으로 복구했습니다. 이후 원인과 제약을 분석하고 Java/Spring 전환을 설계했으며 저는 이 두 단계에 참여했습니다. 기존 .NET은 사내 보안 라이브러리 때문에 런타임 버전이 고정되어 Redis Cluster·MongoDB 연동이 어려웠습니다. 이 제약이 장애의 직접 원인은 아니지만 대응 폭을 좁혔습니다. 전환과 운영, Caffeine 캐시 적용은 팀 작업입니다.</desc><defs><marker id="login-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="login-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="login-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="login-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="login-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="14" y="24" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">진행 흐름</text><path d="M30 56L30 296" fill="none" stroke="#285fbc" stroke-width="1.6"/><circle cx="30" cy="56" r="9" fill="#fff" stroke="#b33c42" stroke-width="2"/><path d="m26.5 52.5 7 7 m0 -7 -7 7" stroke="#b33c42" stroke-width="1.8"/><text x="52" y="58" font-size="17" style="fill:#b33c42" font-weight="750" text-anchor="start">장애</text><text x="52" y="80" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">전체 로그인 불가</text><circle cx="30" cy="116" r="9" fill="#fff" stroke="#52677c" stroke-width="2"/><text x="52" y="118" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">재기동</text><text x="52" y="140" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">증상만 복구</text><circle cx="30" cy="176" r="9" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="52" y="178" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">원인 · 제약 분석</text><text x="52" y="200" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">DB 연결 단계</text><circle cx="30" cy="236" r="9" fill="#fff" stroke="#285fbc" stroke-width="2"/><text x="52" y="238" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">전환 설계</text><text x="52" y="260" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">Java/Spring</text><circle cx="30" cy="296" r="9" fill="#fff" stroke="#157458" stroke-width="2"/><text x="52" y="298" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">전환 · 운영</text><text x="52" y="320" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">팀 작업</text><path d="M236 162H246V258H236" fill="none" stroke="#285fbc" stroke-width="1.8"/><text x="254" y="206" font-size="15" style="fill:#285fbc" font-weight="700" text-anchor="start">제가</text><text x="254" y="226" font-size="15" style="fill:#285fbc" font-weight="700" text-anchor="start">참여</text><path d="M14 342L316 342" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="370" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">바꾼 것은 언어보다 제약</text><rect x="14" y="384" width="302" height="108" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="28" y="412" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="start">기존 .NET 서비스</text><text x="28" y="440" font-size="15" style="fill:#b33c42" font-weight="650" text-anchor="start">× 런타임 버전 고정</text><text x="28" y="466" font-size="13.5" style="fill:#b33c42" font-weight="650" text-anchor="start">× Redis Cluster · MongoDB 연동 어려움</text><path d="M165 492L165 514" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#login-narrow-arrow-blue)"/><rect x="14" y="518" width="302" height="108" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="28" y="546" font-size="16" style="fill:#285fbc" font-weight="750" text-anchor="start">Java / Spring 서비스</text><text x="28" y="574" font-size="15" style="fill:#157458" font-weight="650" text-anchor="start">✓ 조직이 지원하는 런타임</text><text x="28" y="600" font-size="14" style="fill:#157458" font-weight="650" text-anchor="start">✓ 연동 기술 적용 · 캐시는 팀 작업</text><path d="M14 646L316 646" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="672" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="start">제약은 장애의 직접 원인이 아니라</text><text x="14" y="694" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="start">대응 폭을 좁히는 조건이었습니다.</text></svg>