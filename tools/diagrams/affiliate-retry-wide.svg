<path d="M444 270H496" fill="none" stroke="#192e42" stroke-width="1.7" marker-end="url(#affiliate-retry-wide-ink)"/>
<rect x="500" y="238" width="174" height="64" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="587.0" y="276.0" font-size="18" style="fill:#285fbc" font-weight="700" text-anchor="middle">재시도</text>
<path d="M587 238V134" fill="none" stroke="#157458" stroke-width="1.7" marker-end="url(#affiliate-retry-wide-green)"/>
<text x="600" y="186" font-size="17" style="fill:#157458" font-weight="600" text-anchor="start">성공</text>
<path d="M587 302V362" fill="none" stroke="#b33c42" stroke-width="1.7" marker-end="url(#affiliate-retry-wide-red)"/>
<text x="600" y="340" font-size="17" style="fill:#b33c42" font-weight="600" text-anchor="start">실패</text>
<rect x="500" y="366" width="174" height="64" rx="6" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/>
<text x="587.0" y="404.0" font-size="18" style="fill:#b33c42" font-weight="700" text-anchor="middle">실패 상태 유지</text>
<path d="M14 458H686" stroke="#cdd8e3"/>
<text x="26" y="490" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">재시도 결과에 따라 완료하거나 실패 상태로 남습니다.</text>
