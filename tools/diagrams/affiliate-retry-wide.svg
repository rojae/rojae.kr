<text x="324" y="85" font-size="17" style="fill:#157458" font-weight="600" text-anchor="middle">성공</text>
<rect x="504" y="66" width="170" height="64" rx="6" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/>
<text x="589.0" y="104.0" font-size="18" style="fill:#157458" font-weight="700" text-anchor="middle">발급 완료</text>
<path d="M206 178H238V270H270" fill="none" stroke="#b33c42" stroke-width="1.7" marker-end="url(#affiliate-retry-wide-red)"/>
<text x="246" y="224" font-size="17" style="fill:#b33c42" font-weight="600" text-anchor="start">실패</text>
<rect x="274" y="238" width="170" height="64" rx="6" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/>
