<svg xmlns="http://www.w3.org/2000/svg" width="700" height="516" viewBox="0 0 700 516" role="img" aria-labelledby="affiliate-retry-wide-title affiliate-retry-wide-desc">
<title id="affiliate-retry-wide-title">쿠폰 발급 실패를 이력으로 남기고 다시 처리하는 흐름</title><desc id="affiliate-retry-wide-desc">인증과 동의가 이미 완료된 뒤의 별도 쿠폰 발급 흐름입니다. 쿠폰 발급 요청이 성공하면 완료합니다. 실패하면 실패 이력을 남기고 재시도하며, 재시도 결과는 성공하거나 실패 상태로 남을 수 있습니다. 모든 실패의 자동 복구, 외부 발급의 멱등성이나 정확히 한 번 실행, 분산 원자성을 보장한다는 의미가 아닙니다.</desc>
<defs>
<marker id="affiliate-retry-wide-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-wide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-wide-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px;fill:#192e42}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="26" y="32" font-size="18" style="fill:#52677c" font-weight="600" text-anchor="start">인증·동의 완료는 유지 · 쿠폰은 별도 처리</text>
