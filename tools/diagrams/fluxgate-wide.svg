<svg xmlns="http://www.w3.org/2000/svg" width="700" height="584" viewBox="0 0 700 584" role="img" aria-labelledby="fluxgate-wide-title fluxgate-wide-desc"><title id="fluxgate-wide-title">확인과 차감은 Redis 안에서 한 번에, 규칙 관리는 별도 경로로</title><desc id="fluxgate-wide-desc">Spring Boot 앱의 Filter가 RateLimitHandler에 판단을 위임합니다. Direct Redis 방식은 앱이 Redis에 직접, HTTP API 방식은 별도 Rate Limit Service를 거쳐 Redis에 갑니다. 두 경로 모두 Redis Lua가 토큰 확인과 차감을 원자적으로 실행해 허용 또는 거부(429)를 정합니다. 규칙 관리는 Studio UI가 Keycloak 인증을 쓰는 Admin API를 호출해 MongoDB에 저장하고, MongoDB 어댑터를 설정한 앱이 읽습니다. 변경은 Redis Pub/Sub으로 알립니다.</desc><defs><marker id="fluxgate-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="30" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">요청 처리</text><rect x="16" y="50" width="262" height="128" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="28" y="72" font-size="14" style="fill:#52677c" font-weight="650" text-anchor="start">Spring Boot 앱</text><rect x="28" y="88" width="96" height="72" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="76" y="130" font-size="17" style="fill:#192e42" font-weight="700" text-anchor="middle">Filter</text><path d="M124 124L142 124" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-ink)"/><rect x="146" y="88" width="120" height="72" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="206" y="119" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="middle" class="mono">RateLimit</text><text x="206" y="140" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="middle" class="mono">Handler</text><path d="M266 104L404 104" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-blue)"/><text x="336" y="94" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="middle">Direct Redis</text><path d="M266 146H286V232H300" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-blue)"/><text x="280" y="206" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="end">HTTP API</text><rect x="304" y="206" width="120" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="364" y="227" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">Rate Limit</text><text x="364" y="248" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">Service</text><path d="M424 232H483V176" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-blue)"/><rect x="408" y="66" width="150" height="108" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="483" y="106" font-size="20" style="fill:#285fbc" font-weight="750" text-anchor="middle">Redis Lua</text><text x="483" y="129" font-size="17" style="fill:#192e42" font-weight="700" text-anchor="middle">확인 → 차감</text><text x="483" y="150" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">한 번에 실행</text><path d="M558 96L590 96" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><text x="596" y="102" font-size="18" style="fill:#157458" font-weight="750" text-anchor="start">허용</text><path d="M558 144L590 144" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-red)"/><text x="596" y="150" font-size="18" style="fill:#b33c42" font-weight="750" text-anchor="start">429 거부</text><text x="26" y="292" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="start">예) 잔여 1을 동시에 본 A·B 중 A만 차감되고 B는 거부됩니다.</text><text x="26" y="316" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">토큰 보충 시각은 Redis TIME 기준 · 같은 키·슬롯에 판단이 모이는 비용은 남습니다.</text><path d="M16 340L684 340" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="372" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">규칙 관리</text><rect x="26" y="392" width="120" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="86" y="414" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Studio UI</text><text x="86" y="434" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Next.js</text><path d="M146 418L178 418" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-ink)"/><rect x="182" y="392" width="132" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="248" y="414" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Admin API</text><text x="248" y="434" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">규칙 생성·수정</text><path d="M248 444L248 474" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="182" y="476" width="132" height="40" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="248" y="502" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="middle">Keycloak 인증</text><path d="M314 418L346 418" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><path d="M350 397a56 9 0 0 1 112 0v42a56 9 0 0 1 -112 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M350 397a56 9 0 0 0 112 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="406" y="429" font-size="16" style="fill:#157458" font-weight="700" text-anchor="middle">MongoDB</text><path d="M462 418L494 418" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><rect x="498" y="392" width="186" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="591" y="414" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">MongoDB 어댑터 앱</text><text x="591" y="434" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">규칙 조회</text><text x="498" y="474" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">변경 알림: Redis Pub/Sub</text><text x="498" y="496" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">→ 캐시 무효화 · 재조회</text><path d="M16 536L684 536" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="564" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">차감의 원자성과 규칙 변경 알림은 서로 다른 역할입니다.</text></svg>