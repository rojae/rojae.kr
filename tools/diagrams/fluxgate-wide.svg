<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="fluxgate-wide-title fluxgate-wide-desc"><title id="fluxgate-wide-title">Lua 스크립트로 차감을 원자적으로 판단하고, Redis Pub/Sub으로 규칙 변경을 감지합니다</title><desc id="fluxgate-wide-desc">요청마다 Redis에서 Lua 스크립트 하나가 실행됩니다. 스크립트는 Redis TIME으로 현재 시각을 읽고, 경과 시간만큼 토큰을 보충하고, 모든 밴드의 잔여를 확인한 뒤 전부 차감하거나 하나도 차감하지 않습니다. Redis는 스크립트 실행 중 다른 명령을 끼워 넣지 않으므로 잔여 1을 동시에 노린 A와 B 중 먼저 실행된 A만 허용되고 B는 429로 거부됩니다. 앱이 Redis를 직접 쓰는 Direct Redis 방식과 HTTP API로 Rate Limit Service를 호출하는 방식 모두 같은 스크립트로 판단합니다. 규칙은 Studio UI에서 Keycloak 인증을 쓰는 Admin API로 바꾸고 MongoDB에 저장합니다. 변경이 커밋되면 Admin API가 Redis Pub/Sub 채널에 발행하고, 구독한 앱 인스턴스가 규칙 캐시를 무효화한 뒤 다시 읽습니다. 현재 LTS는 주기 조회로 알림 누락을 보완합니다.</desc><defs><marker id="fluxgate-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fluxgate-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="30" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="start">① 차감 판단 · Lua 스크립트 한 번의 실행</text><text x="26" y="96" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">요청 A</text><text x="26" y="160" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">요청 B</text><text x="26" y="118" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">먼저 실행</text><text x="26" y="182" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">A가 끝난 뒤 실행</text><path d="M92 91L158 91" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-blue)"/><path d="M92 155L158 155" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-blue)"/><rect x="162" y="52" width="352" height="196" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="180" y="80" font-size="17" style="fill:#285fbc" font-weight="750" text-anchor="start">Redis</text><text x="236" y="80" font-size="14" style="fill:#285fbc" font-weight="500" text-anchor="start" class="mono">token_bucket_consume.lua</text><circle cx="190" cy="109" r="10" fill="#285fbc"/><text x="190" y="114" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">1</text><text x="210" y="114" font-size="16" style="fill:#192e42" font-weight="550" text-anchor="start">Redis TIME으로 현재 시각 읽기</text><circle cx="190" cy="139" r="10" fill="#285fbc"/><text x="190" y="144" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">2</text><text x="210" y="144" font-size="16" style="fill:#192e42" font-weight="550" text-anchor="start">경과 시간만큼 토큰 보충</text><circle cx="190" cy="169" r="10" fill="#285fbc"/><text x="190" y="174" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">3</text><text x="210" y="174" font-size="16" style="fill:#192e42" font-weight="550" text-anchor="start">모든 밴드의 잔여 확인</text><circle cx="190" cy="199" r="10" fill="#285fbc"/><text x="190" y="204" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">4</text><text x="210" y="204" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="start">전부 차감 또는 하나도 차감 안 함</text><text x="180" y="234" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="start">실행 중에는 다른 명령이 끼어들지 않습니다</text><path d="M514 106L548 106" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><text x="554" y="104" font-size="18" style="fill:#157458" font-weight="750" text-anchor="start">A 허용</text><text x="554" y="126" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">잔여 1 → 0</text><path d="M514 186L548 186" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-red)"/><text x="554" y="184" font-size="18" style="fill:#b33c42" font-weight="750" text-anchor="start">B 429 거부</text><text x="554" y="206" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">잔여 0 · 상태 유지</text><text x="26" y="278" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">Direct Redis와 HTTP API(Rate Limit Service) 두 연동 방식 모두 이 스크립트로 판단합니다.</text><path d="M16 300L684 300" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="332" font-size="15" style="fill:#157458" font-weight="650" text-anchor="start">② 규칙 변경 감지 · Redis Pub/Sub</text><rect x="26" y="350" width="120" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="86" y="372" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Studio UI</text><text x="86" y="392" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Next.js</text><path d="M146 376L178 376" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-ink)"/><rect x="182" y="350" width="140" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="252" y="372" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Admin API</text><text x="252" y="392" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Keycloak 인증</text><path d="M322 376L354 376" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><text x="338" y="366" font-size="13" style="fill:#157458" font-weight="500" text-anchor="middle">저장</text><path d="M358 355a58 9 0 0 1 116 0v42a58 9 0 0 1 -116 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M358 355a58 9 0 0 0 116 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="416" y="387" font-size="16" style="fill:#157458" font-weight="700" text-anchor="middle">MongoDB</text><path d="M252 402L252 446" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><text x="262" y="430" font-size="14" style="fill:#157458" font-weight="650" text-anchor="start">커밋 후 발행</text><rect x="182" y="450" width="140" height="56" rx="6" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="252" y="474" font-size="16" style="fill:#157458" font-weight="750" text-anchor="middle">Redis Pub/Sub</text><text x="252" y="494" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">rule-reload 채널</text><path d="M322 478H420" fill="none" stroke="#157458" stroke-width="1.6"/><path d="M420 436V540" fill="none" stroke="#157458" stroke-width="1.6"/><path d="M420 436L516 436" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><rect x="520" y="416" width="160" height="40" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="600" y="442" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">앱 인스턴스 1</text><path d="M420 488L516 488" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><rect x="520" y="468" width="160" height="40" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="600" y="494" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">앱 인스턴스 2</text><path d="M420 540L516 540" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-wide-arrow-green)"/><rect x="520" y="520" width="160" height="40" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="600" y="546" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">앱 인스턴스 N</text><text x="468" y="430" font-size="14" style="fill:#157458" font-weight="650" text-anchor="middle">구독</text><path d="M600 416V376H478" fill="none" stroke="#157458" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#fluxgate-wide-arrow-green)"/><text x="610" y="384" font-size="14" style="fill:#157458" font-weight="650" text-anchor="start">캐시 무효화</text><text x="610" y="404" font-size="14" style="fill:#157458" font-weight="650" text-anchor="start">→ 재조회</text><text x="680" y="584" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="end">알림 누락은 주기 조회로 보완 (LTS)</text><path d="M16 604L684 604" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="632" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">차감 판단의 원자성은 Lua가, 규칙 변경 전파는 Pub/Sub이 맡습니다.</text></svg>