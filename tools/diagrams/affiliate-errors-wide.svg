<svg xmlns="http://www.w3.org/2000/svg" width="700" height="650" viewBox="0 0 700 650" role="img" aria-labelledby="affiliate-errors-wide-title affiliate-errors-wide-desc">
<title id="affiliate-errors-wide-title">개별 데이터의 처리 결과와 작업의 종료 상태</title><desc id="affiliate-errors-wide-desc">두 흐름은 개별 데이터와 작업 전체를 서로 다른 단위로 비교합니다. 정상 데이터는 반영하고, 허용된 유형과 한도 안의 개별 오류는 기록한 뒤 건너뛰어 다음 데이터를 처리합니다. 모든 오류를 건너뛰는 것은 아닙니다. 입력 전체 검증 실패나 처리를 계속할 수 없는 오류는 작업 실패로 이어집니다. 작업 완료 여부와 개별 오류는 따로 확인하며, 실패한 작업은 원인과 처리 범위를 확인합니다. 개별 오류가 있어도 작업은 완료될 수 있습니다. 자동 복구나 데이터 한 건마다의 독립 트랜잭션을 나타내는 그림은 아닙니다.</desc>
<defs>
<marker id="affiliate-errors-wide-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker>
<marker id="affiliate-errors-wide-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker>
<marker id="affiliate-errors-wide-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="affiliate-errors-wide-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="affiliate-errors-wide-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker>
<style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px}</style>
