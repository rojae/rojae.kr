<g class="component"><rect class="node" x="280" y="518" width="150" height="76" rx="7" fill="#fbeef0" stroke="#b33c42" stroke-width="1.3"/>
<text x="355.0" y="562.0" font-size="19" fill="#b33c42" font-weight="700" text-anchor="middle">작업 실패</text>
</g>
