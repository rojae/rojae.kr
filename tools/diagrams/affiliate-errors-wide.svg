<text x="24" y="30" font-size="19" fill="#192e42" font-weight="700" text-anchor="start">개별 데이터 · 무엇을 반영했는가</text>
<g class="component"><rect class="node" x="24" y="114" width="170" height="76" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/>
<text x="109.0" y="158.0" font-size="19" fill="#285fbc" font-weight="700" text-anchor="middle">데이터 처리</text>
</g>
