<path class="route" d="M194 504H230V556H276" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#affiliate-errors-wide-red)"/>
<path class="route" d="M430 434H482" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#affiliate-errors-wide-green)"/>
<path class="route" d="M430 556H482" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#affiliate-errors-wide-red)"/>
<text x="504" y="427" font-size="18" fill="#192e42" font-weight="500" text-anchor="start">개별 오류는</text>
<text x="504" y="454" font-size="18" fill="#192e42" font-weight="500" text-anchor="start">별도로 확인</text>
<text x="504" y="549" font-size="18" fill="#192e42" font-weight="500" text-anchor="start">실패 원인과</text>
<text x="504" y="576" font-size="18" fill="#192e42" font-weight="500" text-anchor="start">처리 범위 확인</text>
<text x="24" y="632" font-size="17" fill="#52677c" font-weight="500" text-anchor="start">입력 전체 검증 실패 등, 처리를 이어갈 수 없는 경우는 작업 실패</text>
</svg>
