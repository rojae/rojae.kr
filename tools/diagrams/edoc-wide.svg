<svg xmlns="http://www.w3.org/2000/svg" width="700" height="572" viewBox="0 0 700 572" role="img" aria-labelledby="edoc-wide-title edoc-wide-desc"><title id="edoc-wide-title">요청 계층마다 이중화하고, DB 접속 경로와 데이터 복제를 나눴습니다</title><desc id="edoc-wide-desc">이용자 요청은 HAProxy 2대와 keepalived VIP를 거쳐 Nginx WEB 3대로, 다시 HAProxy VIP를 거쳐 Tomcat WAS 2대(API·관리자·배치)로 갑니다. WAS는 AUTH(Redis master·replica, Sentinel 3개), KEY(JKS 키 서버), DB를 호출하고 KISA와는 VPN으로 통신합니다. DB 접속은 MaxScale 2대와 Keepalived가, 노드 간 복제는 MariaDB Galera 3노드가 맡습니다. 운영 서버는 22대입니다.</desc><defs><marker id="edoc-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="edoc-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="edoc-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="edoc-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="edoc-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="202" y="22" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">이용자 · 법인</text><text x="300" y="30" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">계층별 서버</text><path d="M202 28L202 48" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-wide-arrow-blue)"/><text x="26" y="68" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">WEB</text><text x="26" y="90" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">3대</text><rect x="136" y="50" width="132" height="40" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="202" y="76" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="middle">HAProxy ×2</text><path d="M268 70L296 70" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-wide-arrow-blue)"/><rect x="300" y="45" width="78" height="50" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="339" y="76" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="middle">Nginx</text><rect x="388" y="45" width="78" height="50" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="427" y="76" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="middle">Nginx</text><rect x="476" y="45" width="78" height="50" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="515" y="76" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="middle">Nginx</text><text x="574" y="68" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">1대는</text><text x="574" y="89" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">별도 도메인</text><text x="26" y="150" font-size="19" style="fill:#192e42" font-weight="750" text-anchor="start">WAS</text><text x="26" y="172" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="start">2대</text><rect x="136" y="132" width="132" height="40" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="202" y="158" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="middle">HAProxy ×2</text><path d="M268 152L296 152" fill="none" stroke="#285fbc" stroke-width="1.6" marker-e