<svg xmlns="http://www.w3.org/2000/svg" width="330" height="722" viewBox="0 0 330 722" role="img" aria-labelledby="affiliate-extension-narrow-title affiliate-extension-narrow-desc">
<title id="affiliate-extension-narrow-title">제휴사 설정을 바꿔 공통 연동 기능을 재사용하는 설계</title><desc id="affiliate-extension-narrow-desc">실제 운영은 한 제휴사입니다. 같은 명세의 제휴사를 추가할 때 제휴사 설정을 통해 공통 동의 처리, 처리 이력, 운영 기능을 재사용하도록 설계한 확장 지점입니다. 여러 제휴사를 실제 운영했다는 뜻이 아니며 다른 명세는 추가 구현이 필요합니다.</desc>
