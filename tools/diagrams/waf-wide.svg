<svg xmlns="http://www.w3.org/2000/svg" width="700" height="574" viewBox="0 0 700 574" role="img" aria-labelledby="waf-wide-title waf-wide-desc"><title id="waf-wide-title">지금 볼 이벤트와 나중에 볼 이벤트를 다른 경로로 보냅니다</title><desc id="waf-wide-desc">Nginx와 ModSecurity가 공격 요청을 차단하고 감사 로그를 JSON으로 남깁니다. Fluent Bit Lua 분류기가 SQL 인젝션·XSS·RCE 룰 또는 이상 점수 20 이상은 실시간 트랙으로, 스캐너 탐지(913xxx)는 분석 트랙으로 보냅니다. 실시간 트랙은 Kafka를 읽는 Go 처리기가 심각도와 GeoIP를 붙여 InfluxDB에 쓰고 Grafana와 대시보드가 봅니다. 분석 트랙은 Logstash가 Elasticsearch에 색인하고 Kibana로 조사하며, ksqlDB가 1분·5분 윈도우 집계를 만듭니다. ClickHouse는 미연결입니다. 커스텀 룰은 룰 파일과 reload 신호를 남기고 nginx -t 검증을 통과하면 무중단 reload합니다.</desc><defs><marker id="waf-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="waf-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="waf-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="waf-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="waf-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="52" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="start">요청</text><path d="M68 46L106 46" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="110" y="20" width="230" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="225" y="42" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">Nginx + ModSecurity</text><text x="225" y="62" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">OWASP CRS · 공격 요청 403</text><path d="M340 46L396 46" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><text x="368" y="38" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">통과</text><rect x="400" y="26" width="100" height="40" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="450" y="52" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="middle">백엔드</text><path d="M225 72L225 104" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#waf-wide-arrow-muted)"/><text x="236" y="94" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">감사 로그 JSON</text><rect x="110" y="108" width="230" height="46" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="225" y="137" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">Fluent Bit · Lua 분류</text><path d="M340 131L396 131" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="400" y="108" width="100" height="46" rx="6" fill="#f2f5f9" stroke="none" stroke-width="1.5"/><text x="450" y="137" font-size="17" style="fill:#192e42" font-weight="750" text-anchor="middle">Kafka</text><path d="M450 154V172H160V384" fill="none" stroke="#192e42" stroke-width="1.6"/><rect x="16" y="184" width="668" height="76" rx="6" fill="#edf3fd" stroke="none" stroke-width="1.5"/><text x="26" y="214" font-size="17" style="fill:#285fbc" font-weight="750" text-anchor="start">실시간</text><text x="26" y="234" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">SQLi · XSS · RCE</text><text x="26" y="252" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">이상 점수 ≥ 20</text><path d="M160 222L180 222" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="184" y="196" width="136" height="52" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="252" y="218" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">Go 처리기</text><text x="252" y="238" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">심각도 · GeoIP</text><path d="M320 222L350 222" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#waf-wide-arrow-blue)"/><rect x="354" y="196" width="136" height="52" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="422" y="218" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">InfluxDB</text><text x="422" y="238" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">시계열</text><path d="M490 222L520 222" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#waf-wide-arrow-blue)"/><rect x="524" y="196" width="136" height="52" rx="6" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="592" y="218" font-size="15.5" style="fill:#285fbc" font-weight="700" text-anchor="middle">Grafana · 대시보드</text><text x="592" y="238" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">실시간 관측</text><rect x="16" y="276" width="668" height="76" rx="6" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="26" y="306" font-size="17" style="fill:#157458" font-weight="750" text-anchor="start">분석</text><text x="26" y="326" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">스캐너 탐지</text><text x="26" y="344" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">913xxx</text><path d="M160 314L180 314" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="184" y="288" width="136" height="52" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="252" y="310" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">Logstash</text><text x="252" y="330" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">GeoIP · 정규화</text><path d="M320 314L350 314" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#waf-wide-arrow-green)"/><rect x="354" y="288" width="136" height="52" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="422" y="310" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">Elasticsearch</text><text x="422" y="330" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">일 단위 인덱스</text><path d="M490 314L520 314" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#waf-wide-arrow-green)"/><rect x="524" y="288" width="136" height="52" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="592" y="310" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">Kibana</text><text x="592" y="330" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">사후 조사</text><path d="M160 384L180 384" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="184" y="362" width="136" height="44" rx="6" fill="#fff" stroke="#157458" stroke-width="1.5"/><text x="252" y="390" font-size="15.5" style="fill:#157458" font-weight="700" text-anchor="middle">ksqlDB</text><text x="334" y="380" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">1·5분 윈도우 집계</text><text x="334" y="400" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">IP 빈도 · 차단율 · 상위 URI</text><rect x="554" y="362" width="136" height="44" rx="6" fill="#fff" stroke="#52677c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="622" y="389" font-size="14" style="fill:#52677c" font-weight="650" text-anchor="middle">ClickHouse 미연결</text><path d="M16 428L684 428" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="26" y="458" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">룰 반영</text><rect x="26" y="474" width="190" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="121" y="496" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">대시보드 API</text><text x="121" y="516" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">커스텀 룰 저장</text><path d="M216 500L244 500" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="248" y="474" width="190" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="343" y="496" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">룰 파일 · 신호</text><text x="343" y="516" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">reload 신호 파일</text><path d="M438 500L466 500" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#waf-wide-arrow-ink)"/><rect x="470" y="474" width="190" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="565" y="496" font-size="15.5" style="fill:#192e42" font-weight="700" text-anchor="middle">nginx -t 검증</text><text x="565" y="516" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">통과 시 무중단 reload</text><text x="26" y="556" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="start">검증에 실패한 룰은 반영하지 않고 기존 설정을 유지합니다.</text></svg>