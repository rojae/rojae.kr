<svg xmlns="http://www.w3.org/2000/svg" width="700" height="824" viewBox="0 0 700 824" role="img" aria-labelledby="fluxgate-architecture-wide-title fluxgate-architecture-wide-desc"><title id="fluxgate-architecture-wide-title">FluxGate 전체 구조 · 요청 처리와 규칙 관리</title><desc id="fluxgate-architecture-wide-desc">Client의 요청은 Spring Boot Filter에서 RateLimitHandler로 전달됩니다. Direct Redis는 앱 내 FluxGate 엔진이, HTTP API는 별도 Rate Limit Service의 엔진이 Redis Lua를 호출합니다. 규칙 관리는 Studio에서 Keycloak 인증을 적용한 Admin API를 거쳐 MongoDB에 저장합니다. Mongo adapter를 설정한 엔진은 Caffeine 캐시로 규칙을 조회하고, Pub/Sub 변경 알림은 캐시를 무효화해 다음 조회에서 원본을 다시 읽게 합니다. HTTP 샘플의 별도 Redis 규칙 원본과 Mongo 원본은 자동 통합되지 않습니다.</desc>
<defs><marker id="fluxgate-architecture-wide-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="fluxgate-architecture-wide-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fluxgate-architecture-wide-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fluxgate-architecture-wide-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fluxgate-architecture-wide-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs>
