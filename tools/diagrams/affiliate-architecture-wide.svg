<svg xmlns="http://www.w3.org/2000/svg" width="700" height="628" viewBox="0 0 700 628" role="img" aria-labelledby="affiliate-architecture-wide-title affiliate-architecture-wide-desc">
<title id="affiliate-architecture-wide-title">동의와 데이터를 구분한 제휴 연동</title>
<desc id="affiliate-architecture-wide-desc">제휴 연동을 설명하는 일반 개념도입니다. 서비스에서 받은 동의와 카드사에서 받은 동의는 제휴 연동을 거쳐 동의 상태와 처리 이력으로 남습니다. 제휴 데이터는 별도의 데이터 처리를 거쳐 후속 업무에 활용됩니다. 운영 관리는 설정과 결과 확인의 관계를 나타냅니다. 연결선은 개념적 처리 흐름이며 실제 시스템 배치를 나타내지 않습니다.</desc>
