<svg xmlns="http://www.w3.org/2000/svg" width="700" height="918" viewBox="0 0 700 918" role="img" aria-labelledby="affiliate-architecture-wide-title affiliate-architecture-wide-desc"><title id="affiliate-architecture-wide-title">제휴 동의 수신과 월 데이터 적재를 분리한 구조</title><desc id="affiliate-architecture-wide-desc">삼성카드에 실제 적용한 제휴 연동의 개념 구조입니다. 지마켓 로그인·삼성카드 결제 고객은 지마켓 화면의 넛지에서 삼성카드 인증 화면을 열고 실시간으로 인증·동의합니다. 삼성카드는 지마켓 결제 이력 고객에게 넛지를 제공하고 받은 동의를 매일 09:00 API로 전달합니다. 두 API 경로는 member-be의 공통 동의 서비스를 사용하며 CI 회원 매칭, 동의·철회와 이력을 처리합니다. 별도 member-batch는 삼성카드 보유 데이터를 월 SFTP 파일로 받아 Spring Batch로 적재하며, 적재 데이터는 마케팅에 활용됩니다. 관리자 설정은 제휴사, 제휴 코드, 완료 고객당 정산 단가이며 동의·배치·리워드를 관측합니다. 제휴 API에는 전용 Gateway 라우트와 Nginx Ingress가 있으나 이 도식은 물리 네트워크 배치가 아닙니다. SFTP 파일은 HTTP 진입 경로를 통과하지 않습니다. 동일 규격의 코드 재사용은 설계 방향이며 동적 전략 테이블을 구현했다는 의미가 아닙니다.</desc><defs><marker id="affiliate-architecture-wide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="16" y="27" font-size="18" fill="#52677c" font-weight="650" text-anchor="start">고객·제휴사 입력</text><text x="362" y="27" font-size="20" fill="#192e42" font-weight="750" text-anchor="middle">제휴 연동 플랫폼</text><text x="602" y="27" font-size="18" fill="#157458" font-weight="650" text-anchor="middle">저장·활용</text><rect x="228" y="48" width="268" height="646" rx="9" fill="#fff" stroke="#cdd8e3" stroke-width="1.4"/><text x="362" y="82" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">member-be · 공통 동의 서비스</text><text x="16" y="98" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">01 실시간</text><g class="component"><rect class="node" x="16" y="112" width="188" height="132" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="110.0" y="141" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">지마켓 화면</text><text x="110.0" y="170" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">로그인·삼성카드</text><text x="110.0" y="196" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">결제 고객에게 넛지</text></g><g class="component"><rect class="node" x="244" y="112" width="236" height="132" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="362.0" y="141" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">실시간 인증·동의</text><text x="362.0" y="170" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">삼성카드 인증 화면 연동</text><text x="362.0" y="196" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">동의 결과 처리</text></g><g class="component"><rect class="node" x="520" y="112" width="164" height="132" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="602.0" y="141" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">동의·이력 저장</text><text x="602.0" y="170" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">실시간 동의 결과</text></g><path class="route" d="M204 178 H240" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><path class="route" d="M480 178 H516" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><text x="16" y="290" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">02 매일 09:00 API</text><g class="component"><rect class="node" x="16" y="306" width="188" height="132" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="110.0" y="335" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">삼성카드</text><text x="110.0" y="364" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">지마켓 결제 이력 고객</text><text x="110.0" y="390" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">넛지 제공·동의 수집</text></g><g class="component"><rect class="node" x="244" y="306" width="236" height="132" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="362.0" y="335" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">CI 회원 매칭</text><text x="362.0" y="364" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">동의·철회 처리</text><text x="362.0" y="390" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">API 묶음 수신 확인</text></g><g class="component"><rect class="node" x="520" y="306" width="164" height="132" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="602.0" y="335" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">동의·이력 저장</text><text x="602.0" y="364" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">일별 수신 결과</text></g><path class="route" d="M204 372 H240" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><path class="route" d="M480 372 H516" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><path d="M244 472 H480" stroke="#cdd8e3" stroke-width="1.3"/><text x="16" y="514" font-size="18" fill="#285fbc" font-weight="750" text-anchor="start">03 월 SFTP 파일</text><text x="362" y="514" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">member-batch · 별도 배치</text><g class="component"><rect class="node" x="16" y="542" width="188" height="120" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="110.0" y="571" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">삼성카드</text><text x="110.0" y="600" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">보유 데이터</text><text x="110.0" y="626" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">월 파일 전달</text></g><g class="component"><rect class="node" x="244" y="542" width="236" height="120" rx="7" fill="#edf3fd" stroke="#285fbc" stroke-width="1.3"/><text x="362.0" y="571" font-size="18" fill="#285fbc" font-weight="750" text-anchor="middle">Spring Batch 적재</text><text x="362.0" y="600" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">SFTP 파일 수신</text><text x="362.0" y="626" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">마케팅 데이터 적재</text></g><g class="component"><rect class="node" x="520" y="542" width="164" height="120" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.3"/><text x="602.0" y="571" font-size="18" fill="#157458" font-weight="750" text-anchor="middle">마케팅 활용</text><text x="602.0" y="600" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">적재 데이터의</text><text x="602.0" y="626" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">후속 활용 단계</text></g><path class="route" d="M204 602 H240" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><path class="route" d="M480 602 H516" fill="none" stroke="#52677c" stroke-width="1.6" marker-end="url(#affiliate-architecture-wide-arrow)"/><path class="route" d="M362 746 V700" fill="none" stroke="#52677c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#affiliate-architecture-wide-arrow)"/><text x="382" y="726" font-size="17" fill="#52677c" font-weight="650" text-anchor="start">설정·운영 관측</text><g class="component"><rect class="node" x="16" y="752" width="668" height="112" rx="7" fill="#f2f5f9" stroke="#52677c" stroke-width="1.3"/><text x="350.0" y="781" font-size="18" fill="#52677c" font-weight="750" text-anchor="middle">관리자</text><text x="350.0" y="810" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">제휴사 → 제휴 코드 → 완료 고객당 정산 단가</text><text x="350.0" y="836" font-size="17" fill="#192e42" font-weight="500" text-anchor="middle">동의·배치·리워드 관측</text></g><text x="350" y="897" font-size="17" fill="#52677c" font-weight="500" text-anchor="middle">실제 적용: 삼성카드 · 일 API는 동의 반영, 월 파일은 데이터 적재</text></svg>