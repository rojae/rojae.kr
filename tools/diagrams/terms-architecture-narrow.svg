<svg xmlns="http://www.w3.org/2000/svg" width="330" height="800" viewBox="0 0 330 800" role="img" aria-labelledby="terms-architecture-narrow-title terms-architecture-narrow-desc">
<title id="terms-architecture-narrow-title">미리 등록한 약관을 조회 시점의 버전으로 제공하는 구조</title><desc id="terms-architecture-narrow-desc">운영자는 어드민에서 HTML 본문과 시행일을 미리 등록하고 드래그 앤 드롭으로 그룹의 약관 항목과 순서를 편집합니다. 공개 페이지는 약관 관리 서비스에 조회를 요청하며, 서비스는 현재 시각에 맞는 적용 버전을 선택합니다. RDB에는 약관 메타데이터와 그룹 매핑 이력을, Blob에는 편집용 JSON과 공개용 HTML을 저장합니다. 화살표는 등록과 조회, 저장소 접근 경로입니다. 회원별 동의 관리는 후속 팀 작업으로 이 그림의 범위가 아닙니다.</desc>
<defs>
<marker id="terms-architecture-narrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
