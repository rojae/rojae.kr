<svg xmlns="http://www.w3.org/2000/svg" width="330" height="642" viewBox="0 0 330 642" role="img" aria-labelledby="terms-architecture-narrow-title terms-architecture-narrow-desc">
<title id="terms-architecture-narrow-title">약관 작성과 저장, 공개 페이지의 조회 경로</title>
<desc id="terms-architecture-narrow-desc">운영자는 관리자 HTML 에디터에서 약관을 등록합니다. 약관 관리 서비스는 약관·버전·시행일·그룹과 매핑 메타데이터를 RDB에, 편집 JSON과 HTML 본문을 Blob에 저장하고 조회합니다. 사용자 브라우저는 지마켓·옥션·ESMPLUS의 공개 약관 페이지에서 사이트와 약관코드로 조회하며, 서비스가 시행일에 맞는 본문을 제공합니다. 사이트별 테이블·시퀀스 이름 차이는 네이밍 전략과 설정으로 처리합니다. 회원별 동의 관리는 이 그림의 범위가 아닙니다.</desc>
<defs><marker id="terms-architecture-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="terms-architecture-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
