<svg xmlns="http://www.w3.org/2000/svg" width="330" height="808" viewBox="0 0 330 808" role="img" aria-labelledby="edoc-narrow-title edoc-narrow-desc"><title id="edoc-narrow-title">요청 계층마다 이중화하고, DB 접속 경로와 데이터 복제를 나눴습니다</title><desc id="edoc-narrow-desc">이용자 요청은 HAProxy 2대와 keepalived VIP를 거쳐 Nginx WEB 3대로, 다시 HAProxy VIP를 거쳐 Tomcat WAS 2대(API·관리자·배치)로 갑니다. WAS는 AUTH(Redis master·replica, Sentinel 3개), KEY(JKS 키 서버), DB를 호출하고 KISA와는 VPN으로 통신합니다. DB 접속은 MaxScale 2대와 Keepalived가, 노드 간 복제는 MariaDB Galera 3노드가 맡습니다. 운영 서버는 22대입니다.</desc><defs><marker id="edoc-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="edoc-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="edoc-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="edoc-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="edoc-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="165" y="26" font-size="15" style="fill:#52677c" font-weight="500" text-anchor="middle">이용자 · 법인</text><path d="M165 34L165 52" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><rect x="28" y="56" width="286" height="92" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="84" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">WEB</text><text x="300" y="84" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="end">HAProxy ×2 · VIP</text><text x="42" y="112" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="start">Nginx ×3</text><text x="42" y="135" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">1대는 별도 도메인</text><path d="M171 148L171 168" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><rect x="28" y="168" width="286" height="92" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="196" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">WAS</text><text x="300" y="196" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="end">HAProxy ×2 · VIP</text><text x="42" y="224" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="start">Tomcat ×2</text><text x="42" y="247" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">API · 관리자 · 배치</text><rect x="28" y="280" width="286" height="92" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="308" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">AUTH</text><text x="300" y="308" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="end">HAProxy ×2 · VIP</text><text x="42" y="336" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="start">Redis master · replica</text><text x="42" y="359" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">Sentinel ×3 · 세션 토큰</text><rect x="28" y="392" width="286" height="92" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="42" y="420" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">KEY</text><text x="300" y="420" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="end">HAProxy ×2 · VIP</text><text x="42" y="448" font-size="16" style="fill:#192e42" font-weight="650" text-anchor="start">키 서버 ×2</text><text x="42" y="471" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">JKS 암호화 키</text><path d="M28 214H14V560" fill="none" stroke="#285fbc" stroke-width="1.6"/><path d="M14 326L26 326" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><path d="M14 438L26 438" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><path d="M14 560L26 560" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><text x="300" y="236" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="end">KISA · VPN</text><rect x="28" y="504" width="286" height="196" rx="6" fill="#f1f8f5" stroke="none" stroke-width="1.5"/><text x="42" y="532" font-size="18" style="fill:#192e42" font-weight="750" text-anchor="start">DB</text><rect x="42" y="546" width="258" height="44" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="171" y="573" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="middle">01 접속 · MaxScale ×2 · Keepalived</text><path d="M171 590L171 610" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#edoc-narrow-arrow-blue)"/><path d="M46 623a36 9 0 0 1 72 0v32a36 9 0 0 1 -72 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M46 623a36 9 0 0 0 72 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="82" y="649" font-size="15" style="fill:#157458" font-weight="650" text-anchor="middle">노드</text><path d="M134 623a36 9 0 0 1 72 0v32a36 9 0 0 1 -72 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M134 623a36 9 0 0 0 72 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="170" y="649" font-size="15" style="fill:#157458" font-weight="650" text-anchor="middle">노드</text><path d="M222 623a36 9 0 0 1 72 0v32a36 9 0 0 1 -72 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M222 623a36 9 0 0 0 72 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="258" y="649" font-size="15" style="fill:#157458" font-weight="650" text-anchor="middle">노드</text><path d="M118 637L134 637" fill="none" stroke="#157458" stroke-width="2"/><path d="M206 637L222 637" fill="none" stroke="#157458" stroke-width="2"/><text x="171" y="688" font-size="14" style="fill:#157458" font-weight="650" text-anchor="middle">02 Galera 복제 · 접속과 따로 확인</text><path d="M14 720L316 720" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="746" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">운영 서버 22대</text><text x="14" y="770" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">HAProxy 8 · WEB 3 · WAS 2 · AUTH 2</text><text x="14" y="792" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">KEY 2 · MaxScale 2 · DB 3</text></svg>