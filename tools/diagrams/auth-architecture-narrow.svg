<svg xmlns="http://www.w3.org/2000/svg" width="330" height="1305" viewBox="0 0 330 1305" role="img" aria-labelledby="auth-architecture-narrow-title auth-architecture-narrow-desc"><title id="auth-architecture-narrow-title">다섯 인증 모듈과 공통 세션을 묶은 통합인증 서비스 전체 구조</title><desc id="auth-architecture-narrow-desc">지마켓, 옥션, ESMPLUS가 하나의 통합인증 서비스에 진입합니다. 도메인 정책으로 인증 유형을 판단하고, 다섯 내부 모듈은 UUID 조회와 관리자 설정 유효기간에 따른 세션 활성 여부 확인을 공통으로 사용합니다. 소유인증, 본인인증, 계좌인증, 정보인증, 기업인증은 별도 마이크로서비스가 아닌 내부 모듈입니다. 외부 연동이 필요한 인증은 업체별 신규 요청 비율에 따라 외부 인증업체를 선택합니다. 인증 관리자는 도메인 연동, 인증업체 비율과 세션 유효기간을 관리합니다. 실선은 요청 처리, 점선은 관리 설정입니다.</desc><defs><marker id="auth-architecture-narrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="auth-architecture-narrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px}</style></defs><rect width="100%" height="100%" fill="#fff"/><g class="component"><rect class="node" x="16" y="18" width="298" height="68" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="45" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">지마켓 · 옥션 · ESMPLUS</text><text x="165" y="69" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">연동 서비스</text></g><rect class="service-boundary" x="10" y="115" width="310" height="870" rx="7" fill="#edf3fd" stroke="#cdd8e3" stroke-width="1.5"/><text x="26" y="143" font-size="18" fill="#285fbc" font-weight="700" text-anchor="start">통합인증 서비스</text><path class="route" d="M280 86 V160" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="26" y="165" width="278" height="76" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="192" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">공통 API · 도메인 정책</text><text x="165" y="216" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">도메인 · 인증 유형 판단</text></g><path class="route" d="M165 241 V273" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="26" y="278" width="278" height="86" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="165" y="305" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">공통 UUID 세션</text><text x="165" y="329" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">조회 · 유효기간 · 활성 여부</text></g><path class="route" d="M165 364 V390 H28 V804" fill="none" stroke="#285fbc" stroke-width="1.6"/><text x="50" y="410" font-size="16" fill="#285fbc" font-weight="650" text-anchor="start">한 서비스 안의 다섯 인증 모듈</text><path class="route" d="M28 460 H45" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="50" y="426" width="230" height="68" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="453" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">소유인증</text><text x="165" y="477" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">휴대폰 · 이메일</text></g><path class="route" d="M280 460 H302" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M28 546 H45" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="50" y="512" width="230" height="68" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="539" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">본인인증</text><text x="165" y="563" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">휴대폰 · 본인확인</text></g><path class="route" d="M280 546 H302" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M28 632 H45" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="50" y="598" width="230" height="68" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="625" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">계좌인증</text><text x="165" y="649" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">1원인증 · 계좌주명</text></g><path class="route" d="M280 632 H302" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M28 718 H45" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="50" y="684" width="230" height="68" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="711" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">정보인증</text><text x="165" y="735" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">ID·비밀번호 · 소셜인증</text></g><path class="route" d="M280 718 H302" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M28 804 H45" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="50" y="770" width="230" height="68" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="797" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">기업인증</text><text x="165" y="821" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">사업자확인</text></g><path class="route" d="M280 804 H302" fill="none" stroke="#285fbc" stroke-width="1.6"/><path class="route" d="M302 460 V848 H165 V875" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="26" y="880" width="278" height="90" rx="7" fill="#fff" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="907" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">인증업체 선택</text><text x="165" y="931" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">신규 요청에 업체별 비율 적용</text><text x="165" y="953" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">외부 연동이 필요한 인증만</text></g><path class="route" d="M165 970 V1000" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#auth-architecture-narrow-blue)"/><g class="component"><rect class="node" x="26" y="1005" width="278" height="90" rx="7" fill="#f2f5f9" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="1032" font-size="18" fill="#192e42" font-weight="700" text-anchor="middle">외부 인증업체</text><text x="165" y="1056" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">본인확인 · 계좌확인</text><text x="165" y="1078" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">소셜인증 등</text></g><g class="component"><rect class="node" x="26" y="1174" width="278" height="112" rx="7" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="165" y="1201" font-size="18" fill="#157458" font-weight="700" text-anchor="middle">인증 관리자</text><text x="165" y="1225" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">도메인별 연동 설정</text><text x="165" y="1247" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">업체별 신규 요청 비율</text><text x="165" y="1269" font-size="16" fill="#52677c" font-weight="500" text-anchor="middle">공통 세션 유효기간</text></g><path class="route" d="M304 1230 H324 V203 H309" fill="none" stroke="#157458" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#auth-architecture-narrow-green)"/><text x="26" y="1156" font-size="15" fill="#52677c" font-weight="500" text-anchor="start">실선 요청 처리 · 점선 관리 설정</text></svg>