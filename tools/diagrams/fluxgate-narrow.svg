<svg xmlns="http://www.w3.org/2000/svg" width="330" height="824" viewBox="0 0 330 824" role="img" aria-labelledby="fluxgate-narrow-title fluxgate-narrow-desc"><title id="fluxgate-narrow-title">Lua 스크립트로 차감을 원자적으로 판단하고, Redis Pub/Sub으로 규칙 변경을 감지합니다</title><desc id="fluxgate-narrow-desc">요청마다 Redis에서 Lua 스크립트 하나가 실행됩니다. 스크립트는 Redis TIME으로 현재 시각을 읽고, 경과 시간만큼 토큰을 보충하고, 모든 밴드의 잔여를 확인한 뒤 전부 차감하거나 하나도 차감하지 않습니다. Redis는 스크립트 실행 중 다른 명령을 끼워 넣지 않으므로 잔여 1을 동시에 노린 A와 B 중 먼저 실행된 A만 허용되고 B는 429로 거부됩니다. 앱이 Redis를 직접 쓰는 Direct Redis 방식과 HTTP API로 Rate Limit Service를 호출하는 방식 모두 같은 스크립트로 판단합니다. 규칙은 Studio UI에서 Keycloak 인증을 쓰는 Admin API로 바꾸고 MongoDB에 저장합니다. 변경이 커밋되면 Admin API가 Redis Pub/Sub 채널에 발행하고, 구독한 앱 인스턴스가 규칙 캐시를 무효화한 뒤 다시 읽습니다. 현재 LTS는 주기 조회로 알림 누락을 보완합니다.</desc><defs><marker id="fluxgate-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="14" y="24" font-size="15" style="fill:#285fbc" font-weight="650" text-anchor="start">① 차감 판단 · Lua 스크립트</text><text x="84" y="54" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">요청 A</text><text x="246" y="54" font-size="16" style="fill:#192e42" font-weight="750" text-anchor="middle">요청 B</text><text x="84" y="74" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">먼저 실행</text><text x="246" y="74" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">A가 끝난 뒤</text><path d="M84 82L84 104" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><path d="M246 82L246 104" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><rect x="14" y="108" width="302" height="204" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="28" y="134" font-size="16" style="fill:#285fbc" font-weight="750" text-anchor="start">Redis</text><text x="80" y="134" font-size="13.5" style="fill:#285fbc" font-weight="500" text-anchor="start" class="mono">consume.lua</text><circle cx="36" cy="163" r="10" fill="#285fbc"/><text x="36" y="168" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">1</text><text x="56" y="168" font-size="15" style="fill:#192e42" font-weight="550" text-anchor="start">Redis TIME으로 현재 시각</text><circle cx="36" cy="193" r="10" fill="#285fbc"/><text x="36" y="198" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">2</text><text x="56" y="198" font-size="15" style="fill:#192e42" font-weight="550" text-anchor="start">경과 시간만큼 토큰 보충</text><circle cx="36" cy="223" r="10" fill="#285fbc"/><text x="36" y="228" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">3</text><text x="56" y="228" font-size="15" style="fill:#192e42" font-weight="550" text-anchor="start">모든 밴드의 잔여 확인</text><circle cx="36" cy="253" r="10" fill="#285fbc"/><text x="36" y="258" font-size="13" style="fill:#fff" font-weight="750" text-anchor="middle">4</text><text x="56" y="258" font-size="15" style="fill:#192e42" font-weight="750" text-anchor="start">전부 차감 또는 전부 안 함</text><text x="28" y="298" font-size="13.5" style="fill:#285fbc" font-weight="650" text-anchor="start">실행 중 다른 명령이 끼어들지 않음</text><path d="M84 312L84 334" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><path d="M246 312L246 334" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-red)"/><text x="84" y="358" font-size="17" style="fill:#157458" font-weight="750" text-anchor="middle">A 허용</text><text x="84" y="378" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">잔여 1 → 0</text><text x="246" y="358" font-size="17" style="fill:#b33c42" font-weight="750" text-anchor="middle">B 429 거부</text><text x="246" y="378" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">잔여 0</text><text x="14" y="410" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">Direct Redis · HTTP API 모두 같은 스크립트</text><path d="M14 430L316 430" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="458" font-size="15" style="fill:#157458" font-weight="650" text-anchor="start">② 규칙 변경 감지 · Pub/Sub</text><rect x="14" y="472" width="140" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="84" y="494" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Studio UI</text><text x="84" y="514" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">Next.js</text><path d="M154 498L172 498" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-ink)"/><rect x="176" y="472" width="140" height="52" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="246" y="494" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Admin API</text><text x="246" y="514" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">Keycloak 인증</text><path d="M246 524V546H84V566" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><text x="165" y="542" font-size="13" style="fill:#157458" font-weight="500" text-anchor="middle">저장</text><path d="M24 579a60 9 0 0 1 120 0v36a60 9 0 0 1 -120 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M24 579a60 9 0 0 0 120 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="84" y="607" font-size="15" style="fill:#157458" font-weight="700" text-anchor="middle">MongoDB</text><path d="M246 524L246 566" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><text x="256" y="552" font-size="13" style="fill:#157458" font-weight="650" text-anchor="start">커밋 후 발행</text><rect x="176" y="570" width="140" height="54" rx="6" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/><text x="246" y="593" font-size="15" style="fill:#157458" font-weight="750" text-anchor="middle">Redis Pub/Sub</text><text x="246" y="612" font-size="13" style="fill:#52677c" font-weight="500" text-anchor="middle">rule-reload</text><path d="M246 624L246 650" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><text x="256" y="642" font-size="13" style="fill:#157458" font-weight="650" text-anchor="start">구독</text><rect x="176" y="654" width="140" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="246" y="677" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">앱 인스턴스들</text><text x="246" y="697" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="middle">캐시 무효화</text><path d="M176 681H84V628" fill="none" stroke="#157458" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#fluxgate-narrow-arrow-green)"/><text x="92" y="700" font-size="13.5" style="fill:#157458" font-weight="650" text-anchor="start">재조회</text><text x="14" y="740" font-size="13.5" style="fill:#52677c" font-weight="500" text-anchor="start">알림 누락은 주기 조회로 보완 (LTS)</text><path d="M14 760L316 760" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="786" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">차감의 원자성은 Lua가,</text><text x="14" y="809" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">규칙 변경 전파는 Pub/Sub이 맡습니다.</text></svg>