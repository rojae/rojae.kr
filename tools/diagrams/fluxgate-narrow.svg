<svg xmlns="http://www.w3.org/2000/svg" width="330" height="904" viewBox="0 0 330 904" role="img" aria-labelledby="fluxgate-narrow-title fluxgate-narrow-desc"><title id="fluxgate-narrow-title">확인과 차감은 Redis 안에서 한 번에, 규칙 관리는 별도 경로로</title><desc id="fluxgate-narrow-desc">Spring Boot 앱의 Filter가 RateLimitHandler에 판단을 위임합니다. Direct Redis 방식은 앱이 Redis에 직접, HTTP API 방식은 별도 Rate Limit Service를 거쳐 Redis에 갑니다. 두 경로 모두 Redis Lua가 토큰 확인과 차감을 원자적으로 실행해 허용 또는 거부(429)를 정합니다. 규칙 관리는 Studio UI가 Keycloak 인증을 쓰는 Admin API를 호출해 MongoDB에 저장하고, MongoDB 어댑터를 설정한 앱이 읽습니다. 변경은 Redis Pub/Sub으로 알립니다.</desc><defs><marker id="fluxgate-narrow-arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#52677c" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker><marker id="fluxgate-narrow-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker><style>text{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;letter-spacing:-.4px;fill:#192e42}.mono{font-family:Menlo,Consolas,monospace;letter-spacing:-.6px}</style></defs><rect width="100%" height="100%" fill="#fff"/><text x="14" y="24" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">요청 처리</text><rect x="14" y="38" width="140" height="46" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="84" y="67" font-size="17" style="fill:#192e42" font-weight="700" text-anchor="middle">Filter</text><path d="M154 61L172 61" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-ink)"/><rect x="176" y="38" width="140" height="46" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="246" y="66" font-size="13.5" style="fill:#192e42" font-weight="650" text-anchor="middle" class="mono">RateLimitHandler</text><path d="M246 84V100H84V122" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><path d="M246 100H246V122" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><text x="84" y="140" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="middle">Direct Redis</text><text x="246" y="140" font-size="14" style="fill:#285fbc" font-weight="650" text-anchor="middle">HTTP API</text><rect x="176" y="152" width="140" height="50" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="246" y="172" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">Rate Limit</text><text x="246" y="193" font-size="15" style="fill:#192e42" font-weight="700" text-anchor="middle">Service</text><path d="M84 150L84 232" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><path d="M246 202L246 232" fill="none" stroke="#285fbc" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-blue)"/><rect x="14" y="236" width="302" height="96" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/><text x="165" y="281" font-size="20" style="fill:#285fbc" font-weight="750" text-anchor="middle">Redis Lua</text><text x="165" y="303" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">확인 → 차감 한 번에 실행</text><path d="M100 332V356" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><text x="100" y="380" font-size="18" style="fill:#157458" font-weight="750" text-anchor="middle">허용</text><path d="M230 332V356" fill="none" stroke="#b33c42" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-red)"/><text x="230" y="380" font-size="18" style="fill:#b33c42" font-weight="750" text-anchor="middle">429 거부</text><text x="14" y="414" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="start">잔여 1을 동시에 본 A·B 중</text><text x="14" y="436" font-size="15" style="fill:#192e42" font-weight="650" text-anchor="start">A만 차감되고 B는 거부됩니다.</text><path d="M14 458L316 458" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="486" font-size="15" style="fill:#52677c" font-weight="650" text-anchor="start">규칙 관리</text><rect x="14" y="500" width="302" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="523" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Studio UI</text><text x="165" y="543" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Next.js</text><path d="M165 554L165 572" fill="none" stroke="#192e42" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-ink)"/><rect x="14" y="574" width="302" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="597" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">Admin API</text><text x="165" y="617" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">Keycloak 인증</text><path d="M165 628L165 646" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><path d="M85 653a80 9 0 0 1 160 0v44a80 9 0 0 1 -160 0z" fill="#fff" stroke="#157458" stroke-width="1.5"/><path d="M85 653a80 9 0 0 0 160 0" fill="none" stroke="#157458" stroke-width="1.5"/><text x="165" y="676" font-size="16" style="fill:#157458" font-weight="700" text-anchor="middle">MongoDB</text><text x="165" y="696" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">규칙 저장</text><path d="M165 702L165 720" fill="none" stroke="#157458" stroke-width="1.6" marker-end="url(#fluxgate-narrow-arrow-green)"/><rect x="14" y="722" width="302" height="54" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/><text x="165" y="745" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="middle">MongoDB 어댑터 앱</text><text x="165" y="765" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="middle">규칙 조회</text><text x="14" y="820" font-size="14" style="fill:#52677c" font-weight="500" text-anchor="start">변경 알림은 Redis Pub/Sub → 캐시 무효화</text><path d="M14 840L316 840" fill="none" stroke="#cdd8e3" stroke-width="1.2"/><text x="14" y="866" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">차감의 원자성과 규칙 알림은</text><text x="14" y="889" font-size="16" style="fill:#192e42" font-weight="700" text-anchor="start">서로 다른 역할입니다.</text></svg>