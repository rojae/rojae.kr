<svg xmlns="http://www.w3.org/2000/svg" width="330" height="656" viewBox="0 0 330 656" role="img" aria-labelledby="affiliate-retry-narrow-title affiliate-retry-narrow-desc">
<title id="affiliate-retry-narrow-title">쿠폰 발급 실패를 이력으로 남기고 다시 처리하는 흐름</title><desc id="affiliate-retry-narrow-desc">인증과 동의가 이미 완료된 뒤의 별도 쿠폰 발급 흐름입니다. 쿠폰 발급 요청이 성공하면 완료합니다. 실패하면 실패 이력을 남기고 재시도하며, 재시도 결과는 성공하거나 실패 상태로 남을 수 있습니다. 모든 실패의 자동 복구, 외부 발급의 멱등성이나 정확히 한 번 실행, 분산 원자성을 보장한다는 의미가 아닙니다.</desc>
<defs>
<marker id="affiliate-retry-narrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#192e42" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-narrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-narrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#157458" stroke-width="1.5"/></marker>
<marker id="affiliate-retry-narrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b33c42" stroke-width="1.5"/></marker>
<style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px;fill:#192e42}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="14" y="30" font-size="18" style="fill:#52677c" font-weight="600" text-anchor="start">인증·동의 완료는 유지</text>
<text x="14" y="58" font-size="18" style="fill:#52677c" font-weight="600" text-anchor="start">쿠폰은 별도 처리</text>
<rect x="65" y="96" width="200" height="66" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="165.0" y="135.0" font-size="18" style="fill:#285fbc" font-weight="700" text-anchor="middle">쿠폰 발급 요청</text>
<path d="M115 162V192H84V230" fill="none" stroke="#b33c42" stroke-width="1.7" marker-end="url(#affiliate-retry-narrow-red)"/>
<path d="M215 162V192H246V230" fill="none" stroke="#157458" stroke-width="1.7" marker-end="url(#affiliate-retry-narrow-green)"/>
<text x="37" y="220" font-size="17" style="fill:#b33c42" font-weight="600" text-anchor="middle">실패</text>
<text x="291" y="220" font-size="17" style="fill:#157458" font-weight="600" text-anchor="middle">성공</text>
<rect x="14" y="234" width="140" height="64" rx="6" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/>
<text x="84.0" y="272.0" font-size="18" style="fill:#b33c42" font-weight="700" text-anchor="middle">실패 이력</text>
<rect x="176" y="234" width="140" height="64" rx="6" fill="#f1f8f5" stroke="#157458" stroke-width="1.5"/>
<text x="246.0" y="272.0" font-size="18" style="fill:#157458" font-weight="700" text-anchor="middle">발급 완료</text>
<path d="M84 298V350" fill="none" stroke="#192e42" stroke-width="1.7" marker-end="url(#affiliate-retry-narrow-ink)"/>
<rect x="14" y="354" width="140" height="64" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="84.0" y="392.0" font-size="18" style="fill:#285fbc" font-weight="700" text-anchor="middle">재시도</text>
<path d="M154 386H246V302" fill="none" stroke="#157458" stroke-width="1.7" marker-end="url(#affiliate-retry-narrow-green)"/>
<text x="246" y="374" font-size="17" style="fill:#157458" font-weight="600" text-anchor="middle">성공</text>
<path d="M84 418V470" fill="none" stroke="#b33c42" stroke-width="1.7" marker-end="url(#affiliate-retry-narrow-red)"/>
<text x="121" y="454" font-size="17" style="fill:#b33c42" font-weight="600" text-anchor="middle">실패</text>
<rect x="14" y="474" width="302" height="64" rx="6" fill="#fbeef0" stroke="#b33c42" stroke-width="1.5"/>
<text x="165.0" y="512.0" font-size="18" style="fill:#b33c42" font-weight="700" text-anchor="middle">실패 상태 유지</text>
<path d="M14 570H316" stroke="#cdd8e3"/>
<text x="14" y="604" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">재시도 결과에 따라 완료하거나</text>
<text x="14" y="630" font-size="17" style="fill:#52677c" font-weight="500" text-anchor="start">실패 상태로 남습니다.</text>
</svg>
