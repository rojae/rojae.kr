<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" role="img" aria-labelledby="affiliate-boundary-wide-title affiliate-boundary-wide-desc">
<title id="affiliate-boundary-wide-title">카드사 연동의 송신·수신 경로</title><desc id="affiliate-boundary-wide-desc">보내는 요청은 제휴 백엔드에서 Nginx를 거쳐 카드사로 갑니다. 받는 요청은 카드사에서 Nginx와 API Gateway를 거쳐 제휴 백엔드로 들어옵니다. API Gateway는 요청을 인증합니다. 송신 경로에 API Gateway가 포함된다는 의미는 아닙니다. 반복된 Nginx 표시는 각 경로의 역할이며 인스턴스 수나 배포 구성을 나타내지 않습니다.</desc>
<defs><marker id="affiliate-boundary-wide-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#285fbc" stroke-width="1.5"/></marker><style>text{font-family:&#39;Pretendard&#39;,&#39;Apple SD Gothic Neo&#39;,&#39;Noto Sans KR&#39;,sans-serif;letter-spacing:-.4px;fill:#192e42}</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="26" y="32" font-size="18" style="fill:#52677c" text-anchor="start" font-weight="650">보내는 요청</text>
<rect x="26" y="54" width="180" height="64" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="116.0" y="92.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">제휴 백엔드</text>
<path d="M206 86H272" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#affiliate-boundary-wide-arrow)"/>
<rect x="276" y="54" width="146" height="64" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="349.0" y="92.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">Nginx</text>
<path d="M422 86H490" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#affiliate-boundary-wide-arrow)"/>
<rect x="494" y="54" width="180" height="64" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="584.0" y="92.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">카드사</text>
<path d="M14 150H686" fill="none" stroke="#cdd8e3"/>
<text x="26" y="186" font-size="18" style="fill:#52677c" text-anchor="start" font-weight="650">받는 요청</text>
<rect x="26" y="208" width="126" height="76" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="89.0" y="252.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">카드사</text>
<path d="M152 246H184" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#affiliate-boundary-wide-arrow)"/>
<rect x="188" y="208" width="126" height="76" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="251.0" y="252.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">Nginx</text>
<path d="M314 246H346" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#affiliate-boundary-wide-arrow)"/>
<rect x="350" y="208" width="162" height="76" rx="6" fill="#edf3fd" stroke="#285fbc" stroke-width="1.5"/>
<text x="431.0" y="240.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">API Gateway</text>
<text x="431.0" y="264.0" font-size="17" style="fill:#52677c" text-anchor="middle" font-weight="650">요청 인증</text>
<path d="M512 246H544" fill="none" stroke="#285fbc" stroke-width="1.7" marker-end="url(#affiliate-boundary-wide-arrow)"/>
<rect x="548" y="208" width="126" height="76" rx="6" fill="#fff" stroke="#cdd8e3" stroke-width="1.5"/>
<text x="611.0" y="252.0" font-size="18" style="fill:#192e42" text-anchor="middle" font-weight="650">제휴 백엔드</text>
<text x="26" y="326" font-size="17" style="fill:#52677c" text-anchor="start" font-weight="500">Nginx는 경로별 역할 표시이며, 인스턴스 수를 뜻하지 않습니다.</text>
</svg>
